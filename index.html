<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Vault</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #fff;
        }
        .app {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 260px;
            background: #1a1a1a;
            border-right: 1px solid #333;
            padding: 20px;
        }
        .logo {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .menu {
            list-style: none;
        }
        .menu li {
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 5px;
        }
        .menu li:hover {
            background: #333;
        }
        .main {
            flex: 1;
            padding: 20px;
        }
        .search-box {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #1f1f1f;
            color: #fff;
            margin-bottom: 20px;
        }
        .card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        th {
            background: #1f1f1f;
        }
        .result-item {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .result-item:hover {
            background: #252525;
        }
        .sheet-name {
            font-size: 12px;
            color: #999;
        }
        .title {
            font-size: 16px;
            margin-top: 5px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #1f1f1f;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #4a9eff;
        }
        button {
            background: #4a9eff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            color: white;
            cursor: pointer;
        }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        @media (max-width: 768px) {
            .app { flex-direction: column; }
            .sidebar { width: 100%; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="logo">🏦 Creator Vault</div>
            <ul class="menu" id="sidebarMenu">
                <li>Loading...</li>
            </ul>
        </aside>
        <main class="main">
            <h1 style="margin-bottom:20px">Creator Vault</h1>
            <input type="text" id="searchInput" class="search-box" placeholder="Cari ebook, produk, prompt...">
            <div id="searchResults"></div>
            <div id="content">
                <div class="card">Memuat Dashboard...</div>
            </div>
        </main>
    </div>

    <script>
        // ==================== CONFIG ====================
        const API_URL = "const API_URL = "const API_URL = "https://script.google.com/macros/s/AKfycbxtkfn059eEdHCPKPeYMu5UL0HyAYtMz7MWb5kQoqmJM1PIDG1RA64AxArCAqQLs_IG/exec";

        // ==================== API CALLS ====================
        async function getSheets() {
            const res = await fetch(`${API_URL}?action=sheets`);
            return await res.json();
        }

        async function getSheetData(sheetName) {
            const res = await fetch(`${API_URL}?action=data&sheet=${encodeURIComponent(sheetName)}`);
            const data = await res.json();
            
            if (Array.isArray(data) && data.length > 0) {
                const headers = data[0];
                const rows = data.slice(1);
                return rows.map(row => {
                    const obj = {};
                    headers.forEach((h, i) => obj[h] = row[i] || "");
                    return obj;
                });
            }
            return [];
        }

        async function searchData(keyword) {
            const res = await fetch(`${API_URL}?action=search&q=${encodeURIComponent(keyword)}`);
            const data = await res.json();
            if (Array.isArray(data)) return data;
            return [];
        }

        // ==================== GLOBAL VARIABLES ====================
        let currentSheet = null;
        let currentData = [];
        let currentHeaders = [];
        let currentPage = 1;
        const perPage = 20;

        // ==================== SIDEBAR ====================
        async function loadSidebar() {
            const menu = document.getElementById("sidebarMenu");
            try {
                const sheets = await getSheets();
                menu.innerHTML = "";
                
                // Dashboard menu
                const dashLi = document.createElement("li");
                dashLi.textContent = "📊 Dashboard";
                dashLi.onclick = () => loadDashboard();
                menu.appendChild(dashLi);
                
                // Separator
                const sep = document.createElement("li");
                sep.textContent = "──────────";
                sep.style.cssText = "opacity:0.3;cursor:default";
                menu.appendChild(sep);
                
                // Sheets
                sheets.forEach(sheet => {
                    const li = document.createElement("li");
                    li.textContent = `📄 ${sheet}`;
                    li.onclick = () => loadSheet(sheet);
                    menu.appendChild(li);
                });
            } catch(e) {
                menu.innerHTML = "<li>Error loading menu</li>";
                console.error(e);
            }
        }

        // ==================== DASHBOARD ====================
        async function loadDashboard() {
            const content = document.getElementById("content");
            content.innerHTML = '<div class="card">Loading dashboard...</div>';
            
            try {
                const sheets = await getSheets();
                let stats = [];
                for (const sheet of sheets) {
                    const data = await getSheetData(sheet);
                    stats.push({ name: sheet, count: data.length });
                }
                const totalItems = stats.reduce((s, i) => s + i.count, 0);
                
                let html = `
                    <div class="stats-grid">
                        <div class="stat-card"><div class="stat-number">${sheets.length}</div><div>Database</div></div>
                        <div class="stat-card"><div class="stat-number">${totalItems}</div><div>Total Items</div></div>
                        <div class="stat-card"><div class="stat-number">⚡</div><div>Live Sync</div></div>
                    </div>
                    <div class="card">
                        <h3>📚 Semua Database</h3>
                        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:15px">
                `;
                
                stats.forEach(s => {
                    html += `<div onclick="loadSheet('${s.name}')" style="background:#1f1f1f;padding:15px;border-radius:10px;cursor:pointer">
                                <div style="font-size:24px">📄</div>
                                <div style="font-weight:bold">${s.name}</div>
                                <div style="font-size:12px;color:#4a9eff">${s.count} items</div>
                            </div>`;
                });
                
                html += `</div></div>`;
                content.innerHTML = html;
                document.getElementById("searchResults").innerHTML = "";
            } catch(e) {
                content.innerHTML = `<div class="card">Error: ${e.message}</div>`;
            }
        }

        // ==================== SHEET VIEWER ====================
        async function loadSheet(sheetName) {
            currentSheet = sheetName;
            currentPage = 1;
            const content = document.getElementById("content");
            content.innerHTML = '<div class="card">Memuat data...</div>';
            
            try {
                currentData = await getSheetData(sheetName);
                if (currentData.length > 0) {
                    currentHeaders = Object.keys(currentData[0]);
                }
                renderSheetData();
                document.getElementById("searchResults").innerHTML = "";
            } catch(e) {
                content.innerHTML = `<div class="card">Error: ${e.message}</div>`;
            }
        }
        
        function renderSheetData() {
            const content = document.getElementById("content");
            
            if (!currentData.length) {
                content.innerHTML = `<div class="card"><h3>📄 ${currentSheet}</h3><p>Tidak ada data</p><button onclick="loadDashboard()">Kembali</button></div>`;
                return;
            }
            
            const totalPages = Math.ceil(currentData.length / perPage);
            const start = (currentPage - 1) * perPage;
            const pageData = currentData.slice(start, start + perPage);
            
            let html = `<div class="card"><h3>📄 ${currentSheet}</h3><p>Total: ${currentData.length} items</p></div>`;
            html += `<div class="card"><div style="overflow-x:auto"><table><thead><tr>`;
            currentHeaders.forEach(h => html += `<th>${h}</th>`);
            html += `<th>Aksi</th></tr></thead><tbody>`;
            
            pageData.forEach((row, idx) => {
                html += `<tr>`;
                currentHeaders.forEach(h => {
                    let val = row[h] || "";
                    val = val.length > 40 ? val.substring(0,40)+"..." : val;
                    html += `<td title="${row[h] || ""}">${val}</td>`;
                });
                html += `<td><button onclick="showDetail(${start + idx})">Detail</button></td>`;
                html += `</tr>`;
            });
            
            html += `</tbody></table></div>`;
            
            if (totalPages > 1) {
                html += `<div class="pagination">
                            <button onclick="changePage(-1)" ${currentPage===1?'disabled':''}>◀ Prev</button>
                            <span>Page ${currentPage} of ${totalPages}</span>
                            <button onclick="changePage(1)" ${currentPage===totalPages?'disabled':''}>Next ▶</button>
                         </div>`;
            }
            html += `</div>`;
            content.innerHTML = html;
        }
        
        function changePage(delta) {
            currentPage += delta;
            renderSheetData();
        }
        
        function showDetail(index) {
            const item = currentData[index];
            if (!item) return;
            
            let html = `<div class="card">
                            <div style="display:flex;justify-content:space-between;margin-bottom:15px">
                                <h3>📋 Detail</h3>
                                <button onclick="loadSheet('${currentSheet}')">✖ Tutup</button>
                            </div>`;
            for (const [key, val] of Object.entries(item)) {
                html += `<div style="display:flex;padding:8px;border-bottom:1px solid #333">
                            <div style="width:150px;font-weight:bold;color:#4a9eff">${key}:</div>
                            <div>${val || "-"}</div>
                         </div>`;
            }
            html += `<div style="margin-top:15px"><button onclick="loadSheet('${currentSheet}')">← Kembali ke daftar</button></div>`;
            html += `</div>`;
            document.getElementById("content").innerHTML = html;
            document.getElementById("searchResults").innerHTML = "";
        }

        // ==================== SEARCH ====================
        let searchTimeout;
        function initSearch() {
            const input = document.getElementById("searchInput");
            input.addEventListener("input", async () => {
                clearTimeout(searchTimeout);
                const keyword = input.value.trim();
                if (keyword.length < 2) {
                    document.getElementById("searchResults").innerHTML = "";
                    return;
                }
                searchTimeout = setTimeout(async () => {
                    const results = document.getElementById("searchResults");
                    results.innerHTML = "<div class='card'>Mencari...</div>";
                    try {
                        const data = await searchData(keyword);
                        if (!data.length) {
                            results.innerHTML = `<div class="card">Tidak ada hasil untuk "${keyword}"</div>`;
                            return;
                        }
                        let html = `<div class="card"><h3>🔍 Hasil: "${keyword}"</h3><p>${data.length} ditemukan</p></div>`;
                        data.forEach(item => {
                            const title = item.title || item.judul || "Tanpa judul";
                            html += `<div class="result-item" onclick="showSearchDetail('${item.sheet}', ${JSON.stringify(item.data).replace(/"/g, '&quot;')})">
                                        <div class="sheet-name">📄 ${item.sheet}</div>
                                        <div class="title">${title}</div>
                                    </div>`;
                        });
                        results.innerHTML = html;
                    } catch(e) {
                        results.innerHTML = `<div class="card">Error: ${e.message}</div>`;
                    }
                }, 300);
            });
        }
        
        function showSearchDetail(sheet, data) {
            let html = `<div class="card">
                            <div style="display:flex;justify-content:space-between;margin-bottom:15px">
                                <h3>📋 Detail dari ${sheet}</h3>
                                <button onclick="location.reload()">✖ Tutup</button>
                            </div>`;
            for (const [key, val] of Object.entries(data)) {
                html += `<div style="display:flex;padding:8px;border-bottom:1px solid #333">
                            <div style="width:150px;font-weight:bold;color:#4a9eff">${key}:</div>
                            <div>${val || "-"}</div>
                         </div>`;
            }
            html += `<div style="margin-top:15px"><button onclick="loadSheet('${sheet}')">← Lihat semua di ${sheet}</button></div>`;
            html += `</div>`;
            document.getElementById("content").innerHTML = html;
            document.getElementById("searchResults").innerHTML = "";
            document.getElementById("searchInput").value = "";
        }

        // ==================== INIT ====================
        async function init() {
            await loadSidebar();
            await loadDashboard();
            initSearch();
        }
        
        // Make functions global
        window.loadDashboard = loadDashboard;
        window.loadSheet = loadSheet;
        window.showDetail = showDetail;
        window.changePage = changePage;
        window.showSearchDetail = showSearchDetail;
        
        init();
    </script>
</body>
</html>
