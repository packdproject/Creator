<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Creator Vault - Digital Library</title>
    <!-- PDF.js for PDF viewing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- EPUB.js for EPUB viewing -->
    <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #f5f7fb;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #666666;
            --border-color: #eef2f6;
            --accent: #4a9eff;
            --accent-dark: #3a7ecc;
            --accent-light: #e8f0fe;
            --sidebar-bg: linear-gradient(180deg, #1a1a2e 0%, #0f0f1a 100%);
            --sidebar-text: #ffffff;
            --danger: #ff4444;
            --success: #00c851;
            --warning: #ffbb33;
        }

        body.dark {
            --bg-primary: #121212;
            --bg-secondary: #1e1e1e;
            --bg-card: #252525;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --border-color: #333333;
            --accent: #4a9eff;
            --accent-light: #1a3a5c;
            --sidebar-bg: linear-gradient(180deg, #0a0a0f 0%, #050508 100%);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        /* ===== SIDEBAR (Desktop) ===== */
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            color: var(--sidebar-text);
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            overflow-y: auto;
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .sidebar-header {
            padding: 24px 20px;
            font-size: 20px;
            font-weight: 700;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu {
            list-style: none;
            padding: 16px 12px;
        }

        .menu-item {
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 4px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
        }

        .menu-item:hover {
            background: rgba(255,255,255,0.1);
        }

        .menu-item.active {
            background: var(--accent);
        }

        .menu-separator {
            padding: 12px 16px 6px;
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            letter-spacing: 1px;
        }

        /* ===== MAIN CONTENT ===== */
        .main {
            flex: 1;
            margin-left: 280px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .main-header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .main-header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .theme-toggle, .refresh-btn {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            width: 38px;
            height: 38px;
            border-radius: 38px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
        }

        .refresh-btn {
            width: auto;
            padding: 0 16px;
            gap: 6px;
            background: var(--accent);
            color: white;
            border: none;
        }

        /* Search */
        .search-container {
            padding: 12px 24px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 60px;
            z-index: 99;
        }

        .search-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
            background: var(--bg-primary);
            border-radius: 30px;
            padding: 4px 16px;
            border: 1px solid var(--border-color);
        }

        .search-box {
            flex: 1;
            padding: 12px 0;
            border: none;
            background: transparent;
            font-size: 15px;
            color: var(--text-primary);
            outline: none;
        }

        .clear-search {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: var(--text-secondary);
            display: none;
        }

        .clear-search.show {
            display: block;
        }

        /* Content Area */
        .content-area {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }

        /* Dashboard Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
        }

        .stat-number {
            font-size: 28px;
            font-weight: 800;
            color: var(--accent);
        }

        .stat-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        /* Category Grid */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .category-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }

        .category-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
            box-shadow: 0 8px 20px rgba(74,158,255,0.15);
        }

        /* PDF/EPUB Viewer */
        .viewer-container {
            background: var(--bg-card);
            border-radius: 20px;
            overflow: hidden;
            height: calc(100vh - 200px);
            display: flex;
            flex-direction: column;
        }

        .viewer-toolbar {
            padding: 12px 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .viewer-toolbar button {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
        }

        .viewer-toolbar button:hover {
            background: var(--accent);
            color: white;
        }

        .viewer-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f0f0f0;
        }

        .pdf-page {
            background: white;
            margin: 0 auto 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .epub-viewer {
            background: white;
            padding: 40px;
            max-width: 800px;
            margin: 0 auto;
            font-family: Georgia, serif;
            line-height: 1.6;
        }

        /* Search Results */
        .search-results {
            margin-top: 16px;
        }

        .result-item {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }

        .result-item:hover {
            border-color: var(--accent);
        }

        .result-title {
            font-weight: 600;
            margin-bottom: 6px;
        }

        .result-sheet {
            font-size: 11px;
            color: var(--accent);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            border-radius: 24px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 20px;
        }

        .detail-row {
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .detail-label {
            font-weight: 600;
            color: var(--accent);
            font-size: 12px;
            margin-bottom: 4px;
        }

        /* Bottom Navigation (Mobile) */
        .bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 8px 16px;
            z-index: 100;
        }

        .bottom-nav-items {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.2s;
            color: var(--text-secondary);
        }

        .bottom-nav-item.active {
            color: var(--accent);
        }

        .bottom-nav-item span:first-child {
            font-size: 22px;
        }

        .bottom-nav-item span:last-child {
            font-size: 11px;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            z-index: 3000;
            animation: fadeInOut 2s ease;
            font-size: 13px;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }

        /* Translate Dropdown */
        .translate-select {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                width: 260px;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main {
                margin-left: 0;
                padding-bottom: 70px;
            }
            .bottom-nav {
                display: block;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .category-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .viewer-toolbar {
                flex-wrap: wrap;
            }
        }

        @media (min-width: 769px) {
            .mobile-menu-btn {
                display: none;
            }
        }

        .mobile-menu-btn {
            display: none;
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 1001;
            background: var(--accent);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            font-size: 22px;
            cursor: pointer;
            color: white;
            align-items: center;
            justify-content: center;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 998;
        }

        @media (max-width: 768px) {
            .mobile-menu-btn {
                display: flex;
            }
        }
    </style>
</head>
<body>

<button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div style="display: flex; min-height: 100vh;">
    <!-- Sidebar Desktop -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>🏦</span>
            <span>Creator Vault</span>
        </div>
        <ul class="menu" id="sidebarMenu">
            <li class="menu-separator">━━ MENU ━━</li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main">
        <div class="main-header">
            <h1 id="pageTitle">Dashboard</h1>
            <div class="header-actions">
                <select id="translateSelect" class="translate-select">
                    <option value="id">🇮🇩 Indonesia</option>
                    <option value="en">🇬🇧 English</option>
                    <option value="ar">🇸🇦 العربية</option>
                    <option value="zh">🇨🇳 中文</option>
                </select>
                <button class="theme-toggle" id="themeToggle">🌙</button>
                <button class="refresh-btn" id="refreshBtn">🔄</button>
            </div>
        </div>

        <div class="search-container">
            <div class="search-wrapper">
                <span>🔍</span>
                <input type="text" id="searchInput" class="search-box" placeholder="Cari ebook, template, atau dokumen..." autocomplete="off">
                <button class="clear-search" id="clearSearchBtn">✕</button>
            </div>
            <div id="searchResults"></div>
        </div>

        <div id="content" class="content-area">
            <div class="loading"><div class="spinner"></div><p>Memuat data...</p></div>
        </div>
    </main>
</div>

<!-- Bottom Navigation (Mobile) -->
<div class="bottom-nav" id="bottomNav">
    <div class="bottom-nav-items">
        <div class="bottom-nav-item" data-nav="dashboard">
            <span>🏠</span>
            <span>Beranda</span>
        </div>
        <div class="bottom-nav-item" data-nav="library">
            <span>📚</span>
            <span>Library</span>
        </div>
        <div class="bottom-nav-item" data-nav="template">
            <span>💬</span>
            <span>Template</span>
        </div>
        <div class="bottom-nav-item" data-nav="profile">
            <span>👤</span>
            <span>Saya</span>
        </div>
    </div>
</div>

<!-- PDF/EPUB Viewer Modal -->
<div class="modal" id="viewerModal">
    <div class="modal-content" style="max-width: 90vw; width: 90%; height: 85vh;">
        <div class="modal-header">
            <h3 id="viewerTitle">Dokumen Viewer</h3>
            <button onclick="closeViewer()" style="background:none;border:none;font-size:24px;cursor:pointer;">✕</button>
        </div>
        <div class="modal-body" id="viewerBody" style="height: calc(100% - 70px); overflow-y: auto;">
            <div class="loading"><div class="spinner"></div><p>Memuat dokumen...</p></div>
        </div>
    </div>
</div>

<script>
    // ========================================
    // KONFIGURASI
    // ========================================
    const API_URL = "https://script.google.com/macros/s/AKfycbxtkfn059eEdHCPKPeYMu5UL0HyAYtMz7MWb5kQoqmJM1PIDG1RA64AxArCAqQLs_IG/exec";
    
    // State
    let allSheetsData = {};
    let allItemsForSearch = [];
    let sheetsList = [];
    let currentView = "dashboard";
    let currentSheet = null;
    let isLoading = false;
    let isDarkMode = localStorage.getItem('theme') === 'dark';
    let currentLanguage = 'id';
    let pdfDoc = null;
    let currentPage = 1;
    let totalPages = 0;

    // ========================================
    // THEME & TRANSLATE
    // ========================================
    function initTheme() {
        if (isDarkMode) {
            document.body.classList.add('dark');
            document.getElementById('themeToggle').innerHTML = '☀️';
        } else {
            document.getElementById('themeToggle').innerHTML = '🌙';
        }
    }

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        if (isDarkMode) {
            document.body.classList.add('dark');
            localStorage.setItem('theme', 'dark');
            document.getElementById('themeToggle').innerHTML = '☀️';
        } else {
            document.body.classList.remove('dark');
            localStorage.setItem('theme', 'light');
            document.getElementById('themeToggle').innerHTML = '🌙';
        }
    }

    // Simple translate using Google Translate API
    async function translateText(text, targetLang) {
        if (!text || targetLang === 'id') return text;
        try {
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
            const response = await fetch(url);
            const data = await response.json();
            return data[0][0][0];
        } catch(e) {
            return text;
        }
    }

    // ========================================
    // PDF & EPUB VIEWER
    // ========================================
    async function openDocument(url, title, type) {
        const modal = document.getElementById('viewerModal');
        const viewerTitle = document.getElementById('viewerTitle');
        const viewerBody = document.getElementById('viewerBody');
        
        viewerTitle.innerHTML = `📄 ${title}`;
        modal.classList.add('active');
        
        if (type === 'pdf') {
            await loadPDF(url, viewerBody);
        } else if (type === 'epub') {
            await loadEPUB(url, viewerBody);
        } else {
            viewerBody.innerHTML = `<iframe src="${url}" style="width:100%;height:100%;border:none;"></iframe>`;
        }
    }
    
    async function loadPDF(url, container) {
        container.innerHTML = `<div class="loading"><div class="spinner"></div><p>Memuat PDF...</p></div>`;
        
        try {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
            const pdf = await pdfjsLib.getDocument(url).promise;
            totalPages = pdf.numPages;
            
            let html = `<div class="viewer-container"><div class="viewer-toolbar">
                <button onclick="prevPage()">◀ Sebelumnya</button>
                <span>Halaman <span id="pageNum">1</span> / <span id="pageCount">${totalPages}</span></span>
                <button onclick="nextPage()">Berikutnya ▶</button>
                <button onclick="zoomIn()">🔍 Zoom In</button>
                <button onclick="zoomOut()">🔍 Zoom Out</button>
            </div><div id="pdfContainer" style="text-align:center;padding:20px;"></div></div>`;
            container.innerHTML = html;
            
            window.pdfDoc = pdf;
            await renderPage(1);
        } catch(e) {
            container.innerHTML = `<div class="empty-state"><p>❌ Gagal memuat PDF: ${e.message}</p></div>`;
        }
    }
    
    async function renderPage(pageNum) {
        const page = await window.pdfDoc.getPage(pageNum);
        const scale = window.currentScale || 1.5;
        const viewport = page.getViewport({ scale: scale });
        
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        canvas.className = 'pdf-page';
        
        await page.render({ canvasContext: context, viewport: viewport }).promise;
        
        const container = document.getElementById('pdfContainer');
        if (container) {
            container.innerHTML = '';
            container.appendChild(canvas);
            document.getElementById('pageNum').innerText = pageNum;
        }
    }
    
    function prevPage() {
        if (currentPage > 1) {
            currentPage--;
            renderPage(currentPage);
        }
    }
    
    function nextPage() {
        if (currentPage < totalPages) {
            currentPage++;
            renderPage(currentPage);
        }
    }
    
    function zoomIn() {
        window.currentScale = (window.currentScale || 1.5) + 0.2;
        renderPage(currentPage);
    }
    
    function zoomOut() {
        window.currentScale = Math.max(0.5, (window.currentScale || 1.5) - 0.2);
        renderPage(currentPage);
    }
    
    async function loadEPUB(url, container) {
        container.innerHTML = `<div class="loading"><div class="spinner"></div><p>Memuat EPUB...</p></div>`;
        try {
            const book = ePub(url);
            const rendition = book.renderTo(container, { width: "100%", height: "100%" });
            await rendition.display();
        } catch(e) {
            container.innerHTML = `<div class="empty-state"><p>❌ Gagal memuat EPUB: ${e.message}</p></div>`;
        }
    }
    
    function closeViewer() {
        document.getElementById('viewerModal').classList.remove('active');
        window.pdfDoc = null;
    }

    // ========================================
    // API FUNCTIONS
    // ========================================
    async function getSheets() {
        const res = await fetch(`${API_URL}?action=sheets`);
        const data = await res.json();
        return Array.isArray(data) ? data : [];
    }

    async function getSheetData(sheetName) {
        const res = await fetch(`${API_URL}?action=data&sheet=${encodeURIComponent(sheetName)}`);
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0 && Array.isArray(data[0])) {
            const headers = data[0];
            const rows = data.slice(1);
            return rows.map(row => {
                const obj = {};
                headers.forEach((h, i) => obj[h] = row[i] || "");
                return obj;
            });
        }
        return Array.isArray(data) ? data : [];
    }

    // ========================================
    // CLIENT-SIDE SEARCH
    // ========================================
    function searchLocal(keyword) {
        if (!keyword || keyword.length < 2) return [];
        const lowerKeyword = keyword.toLowerCase();
        const results = [];
        for (const item of allItemsForSearch) {
            for (const val of Object.values(item.data)) {
                if (val && String(val).toLowerCase().includes(lowerKeyword)) {
                    results.push(item);
                    break;
                }
            }
        }
        return results;
    }

    // ========================================
    // LOAD ALL DATA
    // ========================================
    async function loadAllData(showToastMsg = false) {
        if (isLoading) return;
        isLoading = true;
        
        const content = document.getElementById('content');
        content.innerHTML = `<div class="loading"><div class="spinner"></div><p>Memuat data...</p></div>`;
        
        try {
            sheetsList = await getSheets();
            const promises = sheetsList.map(async sheet => {
                const data = await getSheetData(sheet);
                return { sheet, data };
            });
            const results = await Promise.all(promises);
            
            allItemsForSearch = [];
            results.forEach(result => {
                allSheetsData[result.sheet] = result.data;
                result.data.forEach((item, idx) => {
                    allItemsForSearch.push({
                        sheet: result.sheet,
                        index: idx,
                        data: item,
                        title: Object.values(item)[0] || "Tanpa judul"
                    });
                });
            });
            
            await loadSidebar();
            await showDashboard();
            
            if (showToastMsg) showToast('✅ Data diperbarui');
        } catch(error) {
            console.error(error);
            content.innerHTML = `<div class="empty-state"><p>⚠️ Gagal memuat data</p><button class="refresh-btn" onclick="location.reload()" style="margin-top:16px;">Refresh</button></div>`;
        } finally {
            isLoading = false;
        }
    }

    // ========================================
    // SIDEBAR
    // ========================================
    async function loadSidebar() {
        const menu = document.getElementById("sidebarMenu");
        const icons = {
            "Ebook": "📚", "Produk": "🛒", "TemplateChat": "💬",
            "Affiliate": "🔗", "PromptAI": "🧠", "IdeKonten": "💡", "Notes": "📝"
        };
        
        menu.innerHTML = `
            <li class="menu-item" data-view="dashboard">
                <span>📊</span> Dashboard
            </li>
            <li class="menu-item" data-view="library">
                <span>📚</span> Library
            </li>
            <li class="menu-separator">━━ DATABASE ━━</li>
            ${sheetsList.map(sheet => `
                <li class="menu-item" data-sheet="${sheet}">
                    <span>${icons[sheet] || "📄"}</span> ${escapeHtml(sheet)}
                </li>
            `).join('')}
        `;
        
        document.querySelectorAll('.menu-item[data-view], .menu-item[data-sheet]').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
                item.classList.add('active');
                
                const view = item.dataset.view;
                const sheet = item.dataset.sheet;
                
                if (view === 'dashboard') {
                    currentView = 'dashboard';
                    document.getElementById('pageTitle').innerText = 'Dashboard';
                    showDashboard();
                } else if (view === 'library') {
                    currentView = 'library';
                    document.getElementById('pageTitle').innerText = 'Library';
                    showLibrary();
                } else if (sheet) {
                    currentView = 'sheet';
                    currentSheet = sheet;
                    document.getElementById('pageTitle').innerText = sheet;
                    showSheetData(sheet);
                }
                
                document.getElementById('searchInput').value = '';
                document.getElementById('clearSearchBtn').classList.remove('show');
                document.getElementById('searchResults').innerHTML = '';
                
                if (window.innerWidth <= 768) toggleSidebar(false);
            });
        });
        
        // Bottom nav handlers
        document.querySelectorAll('.bottom-nav-item').forEach(item => {
            item.addEventListener('click', () => {
                const nav = item.dataset.nav;
                document.querySelectorAll('.bottom-nav-item').forEach(n => n.classList.remove('active'));
                item.classList.add('active');
                
                if (nav === 'dashboard') {
                    currentView = 'dashboard';
                    document.getElementById('pageTitle').innerText = 'Dashboard';
                    showDashboard();
                } else if (nav === 'library') {
                    currentView = 'library';
                    document.getElementById('pageTitle').innerText = 'Library';
                    showLibrary();
                } else if (nav === 'template') {
                    currentView = 'sheet';
                    currentSheet = 'TemplateChat';
                    document.getElementById('pageTitle').innerText = 'Template Chat';
                    showSheetData('TemplateChat');
                } else if (nav === 'profile') {
                    showProfile();
                }
            });
        });
        
        document.querySelector('.menu-item[data-view="dashboard"]').classList.add('active');
    }

    // ========================================
    // DASHBOARD
    // ========================================
    function showDashboard() {
        const totalItems = Object.values(allSheetsData).reduce((sum, data) => sum + data.length, 0);
        const ebookCount = allSheetsData['Ebook']?.length || 0;
        const templateCount = allSheetsData['TemplateChat']?.length || 0;
        const promptCount = allSheetsData['PromptAI']?.length || 0;
        
        document.getElementById('content').innerHTML = `
            <div class="stats-grid">
                <div class="stat-card" onclick="showLibrary()">
                    <div class="stat-icon">📚</div>
                    <div class="stat-number">${ebookCount}</div>
                    <div>Ebook</div>
                </div>
                <div class="stat-card" onclick="showSheetData('TemplateChat')">
                    <div class="stat-icon">💬</div>
                    <div class="stat-number">${templateCount}</div>
                    <div>Template Chat</div>
                </div>
                <div class="stat-card" onclick="showSheetData('PromptAI')">
                    <div class="stat-icon">🧠</div>
                    <div class="stat-number">${promptCount}</div>
                    <div>Prompt AI</div>
                </div>
                <div class="stat-card" onclick="showDashboard()">
                    <div class="stat-icon">📊</div>
                    <div class="stat-number">${sheetsList.length}</div>
                    <div>Database</div>
                </div>
            </div>
            <div class="category-grid">
                ${sheetsList.map(sheet => {
                    const icons = {"Ebook":"📚","Produk":"🛒","TemplateChat":"💬","Affiliate":"🔗","PromptAI":"🧠","IdeKonten":"💡","Notes":"📝"};
                    return `
                        <div class="category-card" onclick="showSheetData('${sheet}')">
                            <div style="font-size:32px;">${icons[sheet] || "📄"}</div>
                            <div style="font-weight:600;margin-top:8px;">${escapeHtml(sheet)}</div>
                            <div style="font-size:11px;color:var(--accent);margin-top:4px;">${allSheetsData[sheet]?.length || 0} items</div>
                        </div>
                    `;
                }).join('')}
            </div>
        `;
    }

    // ========================================
    // LIBRARY (Ebook Collection)
    // ========================================
    function showLibrary() {
        const ebooks = allSheetsData['Ebook'] || [];
        if (!ebooks.length) {
            document.getElementById('content').innerHTML = `<div class="empty-state"><span style="font-size:48px;">📭</span><p>Belum ada ebook</p></div>`;
            return;
        }
        
        let html = `<div class="category-grid">`;
        ebooks.forEach((ebook, idx) => {
            const title = ebook.judul || ebook.title || ebook.nama || `Ebook ${idx + 1}`;
            const fileUrl = ebook.file || ebook.link || ebook.url || "";
            const isPDF = fileUrl.includes('.pdf') || fileUrl.includes('drive.google.com');
            const isEPUB = fileUrl.includes('.epub');
            
            html += `
                <div class="category-card" onclick="openDocument('${fileUrl}', '${escapeHtml(title)}', '${isPDF ? 'pdf' : isEPUB ? 'epub' : 'url'}')">
                    <div style="font-size:32px;">${isPDF ? '📕' : isEPUB ? '📘' : '📖'}</div>
                    <div style="font-weight:600;margin-top:8px;">${escapeHtml(title.substring(0, 40))}</div>
                    <div style="font-size:11px;color:var(--text-secondary);">Klik untuk baca</div>
                </div>
            `;
        });
        html += `</div>`;
        document.getElementById('content').innerHTML = html;
    }

    // ========================================
    // SHEET DATA
    // ========================================
    function showSheetData(sheetName) {
        const data = allSheetsData[sheetName] || [];
        if (!data.length) {
            document.getElementById('content').innerHTML = `<div class="empty-state"><span style="font-size:48px;">📭</span><p>Tidak ada data</p></div>`;
            return;
        }
        
        let html = `<div class="category-grid">`;
        data.forEach((item, idx) => {
            const title = Object.values(item)[0] || "Item";
            html += `
                <div class="category-card" onclick="showItemDetail('${sheetName}', ${idx})">
                    <div style="font-size:32px;">📄</div>
                    <div style="font-weight:600;margin-top:8px;">${escapeHtml(title.substring(0, 40))}</div>
                    <div style="font-size:11px;color:var(--accent);">Klik untuk detail</div>
                </div>
            `;
        });
        html += `</div>`;
        document.getElementById('content').innerHTML = html;
    }
    
    function showItemDetail(sheetName, idx) {
        const item = allSheetsData[sheetName][idx];
        if (!item) return;
        
        const modal = document.getElementById('detailModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        
        modalTitle.innerHTML = `📋 ${escapeHtml(sheetName)}`;
        
        let bodyHtml = '';
        for (const [key, val] of Object.entries(item)) {
            let displayVal = escapeHtml(String(val));
            if (typeof val === 'string' && (val.includes('.pdf') || val.includes('.epub') || val.includes('drive.google.com'))) {
                displayVal += `<br><button class="refresh-btn" style="margin-top:8px;" onclick="openDocument('${escapeHtml(val)}', '${escapeHtml(key)}', '${val.includes('.pdf') ? 'pdf' : 'epub'}')">📖 Baca Dokumen</button>`;
            }
            bodyHtml += `
                <div class="detail-row">
                    <div class="detail-label">${escapeHtml(key)}</div>
                    <div class="detail-value">${displayVal}</div>
                </div>
            `;
        }
        modalBody.innerHTML = bodyHtml;
        
        modal.classList.add('active');
    }
    
    function showProfile() {
        const totalItems = Object.values(allSheetsData).reduce((sum, data) => sum + data.length, 0);
        document.getElementById('content').innerHTML = `
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-number">${sheetsList.length}</div><div>Database</div></div>
                <div class="stat-card"><div class="stat-number">${totalItems}</div><div>Total Items</div></div>
                <div class="stat-card"><div class="stat-number">⚡</div><div>Ready</div></div>
            </div>
            <div class="stat-card">
                <h3>👤 Tentang Creator Vault</h3>
                <p style="margin-top:12px;">Personal Knowledge Hub & Digital Library</p>
                <p style="margin-top:8px;color:var(--text-secondary);font-size:13px;">📚 Baca ebook & dokumen</p>
                <p style="color:var(--text-secondary);font-size:13px;">💬 Template chat untuk bisnis</p>
                <p style="color:var(--text-secondary);font-size:13px;">🧠 Prompt AI untuk konten</p>
            </div>
        `;
    }

    // ========================================
    // SEARCH
    // ========================================
    let searchDebounce = null;
    
    function initSearch() {
        const input = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearSearchBtn');
        const resultsDiv = document.getElementById('searchResults');
        
        input.addEventListener('input', (e) => {
            const keyword = e.target.value;
            
            if (keyword.length > 0) {
                clearBtn.classList.add('show');
            } else {
                clearBtn.classList.remove('show');
            }
            
            if (searchDebounce) clearTimeout(searchDebounce);
            
            searchDebounce = setTimeout(() => {
                if (keyword.length === 0) {
                    resultsDiv.innerHTML = '';
                    if (currentView === 'dashboard') showDashboard();
                    else if (currentView === 'library') showLibrary();
                    else if (currentSheet) showSheetData(currentSheet);
                    else showDashboard();
                    return;
                }
                
                if (keyword.length < 2) return;
                
                const results = searchLocal(keyword);
                if (!results.length) {
                    resultsDiv.innerHTML = `<div class="empty-state" style="padding:20px;">😕 Tidak ada hasil</div>`;
                    return;
                }
                
                let html = `<div class="search-results">`;
                results.slice(0, 30).forEach(result => {
                    const preview = Object.values(result.data)[3] || Object.values(result.data)[2] || "";
                    html += `
                        <div class="result-item" onclick="showItemDetail('${result.sheet}', ${result.index})">
                            <div class="result-title">📌 ${escapeHtml(result.title.substring(0, 60))}</div>
                            <div class="result-sheet">📄 ${escapeHtml(result.sheet)}</div>
                            <div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">${escapeHtml(preview.substring(0, 80))}</div>
                        </div>
                    `;
                });
                html += `</div>`;
                resultsDiv.innerHTML = html;
            }, 200);
        });
        
        clearBtn.addEventListener('click', () => {
            input.value = '';
            clearBtn.classList.remove('show');
            resultsDiv.innerHTML = '';
            input.focus();
            if (currentView === 'dashboard') showDashboard();
            else if (currentView === 'library') showLibrary();
            else if (currentSheet) showSheetData(currentSheet);
            else showDashboard();
        });
    }

    // ========================================
    // UTILITIES
    // ========================================
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    
    function showToast(message) {
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }
    
    function toggleSidebar(show) {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        if (show) {
            sidebar.classList.add('open');
            overlay.classList.add('active');
        } else {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        }
    }
    
    async function manualRefresh() {
        if (isLoading) { showToast('⏳ Masih memuat...'); return; }
        showToast('🔄 Mengambil data terbaru...');
        await loadAllData(true);
    }

    // Modal
    const modal = document.createElement('div');
    modal.className = 'modal';
    modal.id = 'detailModal';
    modal.innerHTML = `
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Detail Item</h3>
                <button onclick="closeModal()" style="background:none;border:none;font-size:24px;cursor:pointer;">✕</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    `;
    document.body.appendChild(modal);
    
    function closeModal() {
        document.getElementById('detailModal').classList.remove('active');
    }

    // Global functions
    window.showDashboard = showDashboard;
    window.showLibrary = showLibrary;
    window.showSheetData = showSheetData;
    window.showItemDetail = showItemDetail;
    window.showProfile = showProfile;
    window.closeModal = closeModal;
    window.openDocument = openDocument;
    window.closeViewer = closeViewer;
    window.prevPage = prevPage;
    window.nextPage = nextPage;
    window.zoomIn = zoomIn;
    window.zoomOut = zoomOut;
    window.manualRefresh = manualRefresh;
    window.toggleTheme = toggleTheme;
    
    // ========================================
    // INIT
    // ========================================
    document.addEventListener('DOMContentLoaded', async () => {
        const mobileBtn = document.getElementById('mobileMenuBtn');
        const overlay = document.getElementById('sidebarOverlay');
        const refreshBtn = document.getElementById('refreshBtn');
        const themeToggleBtn = document.getElementById('themeToggle');
        
        mobileBtn.onclick = () => toggleSidebar(true);
        overlay.onclick = () => toggleSidebar(false);
        refreshBtn.onclick = () => manualRefresh();
        themeToggleBtn.onclick = () => toggleTheme();
        
        initTheme();
        await loadAllData(false);
        initSearch();
    });
</script>
</body>
</html>
