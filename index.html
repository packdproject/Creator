<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Creator Vault - Digital Library</title>
    <!-- PDF.js untuk render PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #f5f7fb;
            --bg-secondary: #ffffff;
            --sidebar-bg: linear-gradient(180deg, #1a1a2e 0%, #0f0f1a 100%);
            --sidebar-text: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #666666;
            --border-color: #eef2f6;
            --accent: #4a9eff;
            --card-bg: #ffffff;
            --reader-bg: #f5f4ef;
            --reader-text: #3a3a3a;
        }

        body.dark {
            --bg-primary: #121212;
            --bg-secondary: #1e1e1e;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --border-color: #2a2a2a;
            --sidebar-bg: linear-gradient(180deg, #0a0a0f 0%, #050508 100%);
            --sidebar-text: #e0e0e0;
            --accent: #4a9eff;
            --card-bg: #2a2a2a;
            --reader-bg: #1a1a1a;
            --reader-text: #e0e0e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background 0.2s;
            overflow-x: hidden;
        }

        /* Mobile Menu */
        .mobile-menu-btn {
            display: none;
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 1001;
            background: var(--accent);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            font-size: 22px;
            cursor: pointer;
            color: white;
            align-items: center;
            justify-content: center;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 998;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            color: var(--sidebar-text);
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            overflow-y: auto;
            transition: transform 0.3s ease;
            z-index: 999;
        }

        .sidebar-header {
            padding: 24px 20px;
            font-size: 20px;
            font-weight: 700;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .menu {
            list-style: none;
            padding: 16px 12px;
        }

        .menu-item {
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 4px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
        }

        .menu-item:hover { background: rgba(255,255,255,0.1); }
        .menu-item.active { background: var(--accent); }
        .menu-separator {
            padding: 12px 16px 6px;
            font-size: 10px;
            color: rgba(255,255,255,0.4);
        }

        /* Main Content */
        .main {
            flex: 1;
            margin-left: 280px;
            min-height: 100vh;
        }

        .main-header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .main-header h1 { font-size: 20px; font-weight: 600; }
        .header-actions { display: flex; gap: 12px; }

        .theme-toggle, .refresh-btn {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            width: 38px;
            height: 38px;
            border-radius: 38px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .refresh-btn {
            width: auto;
            padding: 0 16px;
            gap: 6px;
            background: var(--accent);
            color: white;
            border: none;
        }

        /* Search */
        .search-container {
            padding: 12px 24px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 60px;
            z-index: 99;
        }

        .search-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
            background: var(--bg-primary);
            border-radius: 30px;
            padding: 4px 16px;
            border: 1px solid var(--border-color);
        }

        .search-box {
            flex: 1;
            padding: 12px 0;
            border: none;
            background: transparent;
            font-size: 15px;
            color: var(--text-primary);
            outline: none;
        }

        .clear-search {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 4px;
            display: none;
        }
        .clear-search.show { display: block; }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 24px;
            padding: 24px;
        }
        .stat-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .stat-number { font-size: 36px; font-weight: 800; color: var(--accent); }

        /* Ebook Grid */
        .ebook-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 24px;
        }
        .ebook-card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .ebook-card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.1); }
        .ebook-cover {
            height: 180px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
        }
        .ebook-info { padding: 20px; }
        .ebook-title { font-weight: 700; font-size: 16px; margin-bottom: 6px; }
        .ebook-author { font-size: 12px; color: var(--text-secondary); margin-bottom: 10px; }
        .ebook-category {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
        }

        /* Table */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
        }
        .data-table th, .data-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        .data-table th { background: var(--bg-primary); font-weight: 600; }
        .data-table tr:hover { background: var(--bg-primary); cursor: pointer; }

        /* ========================================
           SLIDE READER - SEPERTI MEMBACA BUKU
           ======================================== */
        .reader-container {
            position: fixed;
            top: 0;
            left: 280px;
            right: 0;
            bottom: 0;
            background: var(--reader-bg);
            z-index: 200;
            display: flex;
            flex-direction: column;
        }

        .reader-toolbar {
            background: var(--bg-secondary);
            padding: 10px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .reader-toolbar button, .reader-toolbar select {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 40px;
            cursor: pointer;
            color: var(--text-primary);
            font-size: 12px;
        }

        .reader-toolbar button:hover { background: var(--accent); color: white; }

        /* Swipe/Slide Container */
        .slide-container {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .slide-wrapper {
            display: flex;
            height: 100%;
            transition: transform 0.3s ease-out;
            will-change: transform;
        }

        .slide-page {
            flex: 0 0 100%;
            overflow-y: auto;
            padding: 20px 30px;
            background: var(--reader-bg);
            color: var(--reader-text);
            font-size: 16px;
            line-height: 1.8;
            -webkit-overflow-scrolling: touch;
        }

        /* PDF Canvas untuk slide */
        .pdf-canvas-page {
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--reader-bg);
        }

        .pdf-canvas-page canvas {
            max-width: 100%;
            height: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 8px;
        }

        /* Navigasi Slide */
        .slide-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            background: var(--bg-secondary);
            padding: 8px 20px;
            border-radius: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 15;
        }

        .slide-nav button {
            background: var(--accent);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide-nav button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .slide-nav span {
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            color: var(--text-primary);
        }

        /* Progress Bar di Reader */
        .reader-progress {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(0,0,0,0.1);
            z-index: 15;
        }

        .reader-progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--bg-secondary);
            border-radius: 28px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-header { padding: 18px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; }
        .modal-body { padding: 20px; }
        .detail-row { padding: 12px 0; border-bottom: 1px solid var(--border-color); }

        /* Loading */
        .loading, .empty-state { text-align: center; padding: 60px; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            z-index: 3000;
            animation: fadeInOut 2s ease;
            font-size: 13px;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .mobile-menu-btn { display: flex; }
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.active { display: block; }
            .main { margin-left: 0; }
            .stats-grid { grid-template-columns: 1fr; padding: 16px; }
            .ebook-grid { grid-template-columns: 1fr; padding: 16px; }
            .reader-container { left: 0; }
            .slide-page { padding: 15px 20px; font-size: 14px; }
            .slide-nav button { width: 38px; height: 38px; font-size: 16px; }
            .slide-nav { padding: 6px 16px; gap: 12px; }
        }

        /* Swipe hint untuk mobile */
        .swipe-hint {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
    </style>
</head>
<body>

<button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div style="display: flex; min-height: 100vh;">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>🏦 Creator Vault</span>
        </div>
        <ul class="menu" id="sidebarMenu">
            <li class="menu-separator">━━ MENU ━━</li>
        </ul>
    </aside>

    <main class="main">
        <div class="main-header">
            <h1 id="pageTitle">Dashboard</h1>
            <div class="header-actions">
                <button class="theme-toggle" id="themeToggle">🌙</button>
                <button class="refresh-btn" id="refreshBtn">🔄 Refresh</button>
            </div>
        </div>

        <div class="search-container">
            <div class="search-wrapper">
                <span>🔍</span>
                <input type="text" id="searchInput" class="search-box" placeholder="Cari ebook berdasarkan judul, penulis, atau kategori..." autocomplete="off">
                <button class="clear-search" id="clearSearchBtn">✕</button>
            </div>
        </div>

        <div id="content">
            <div class="loading"><div class="spinner"></div><p>Memuat perpustakaan...</p></div>
        </div>
    </main>
</div>

<div class="modal" id="detailModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Detail Item</h3>
            <button onclick="closeModal()" style="background:none;border:none;font-size:24px;cursor:pointer;">✕</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
    </div>
</div>

<script>
    // ========================================
    // KONFIGURASI
    // ========================================
    const API_URL = "https://script.google.com/macros/s/AKfycbxtkfn059eEdHCPKPeYMu5UL0HyAYtMz7MWb5kQoqmJM1PIDG1RA64AxArCAqQLs_IG/exec";
    
    // State
    let allSheetsData = {};
    let sheetsList = [];
    let currentView = "dashboard";
    let isDarkMode = localStorage.getItem('theme') === 'dark';

    // PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    // ========================================
    // THEME
    // ========================================
    function initTheme() {
        if (isDarkMode) {
            document.body.classList.add('dark');
            document.getElementById('themeToggle').innerHTML = '☀️';
        } else {
            document.getElementById('themeToggle').innerHTML = '🌙';
        }
    }

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        if (isDarkMode) {
            document.body.classList.add('dark');
            localStorage.setItem('theme', 'dark');
            document.getElementById('themeToggle').innerHTML = '☀️';
        } else {
            document.body.classList.remove('dark');
            localStorage.setItem('theme', 'light');
            document.getElementById('themeToggle').innerHTML = '🌙';
        }
    }

    function showToast(message) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // ========================================
    // API FUNCTIONS
    // ========================================
    async function getSheets() {
        try {
            const res = await fetch(`${API_URL}?action=sheets`);
            const data = await res.json();
            return Array.isArray(data) ? data.filter(s => s !== 'Dashboard') : [];
        } catch(e) {
            console.error("getSheets error:", e);
            return [];
        }
    }

    async function getSheetData(sheetName, limit = 200) {
        try {
            const res = await fetch(`${API_URL}?action=data&sheet=${encodeURIComponent(sheetName)}&limit=${limit}`);
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0 && typeof data[0] === 'object' && !Array.isArray(data[0])) {
                return data;
            }
            return [];
        } catch(e) {
            console.error(`getSheetData error:`, e);
            return [];
        }
    }

    // ========================================
    // LOAD ALL DATA (CACHE di memory)
    // ========================================
    let dataLoaded = false;
    
    async function loadAllData() {
        const content = document.getElementById('content');
        content.innerHTML = `<div class="loading"><div class="spinner"></div><p>Memuat perpustakaan...</p></div>`;
        
        try {
            sheetsList = await getSheets();
            
            // Load hanya sheet yang diperlukan
            const promises = sheetsList.map(sheet => getSheetData(sheet, 200));
            const results = await Promise.all(promises);
            
            sheetsList.forEach((sheet, idx) => {
                allSheetsData[sheet] = results[idx];
            });
            
            window.allSheetsData = allSheetsData;
            window.sheetsList = sheetsList;
            dataLoaded = true;
            
            loadSidebar();
            loadDashboard();
            
            console.log("Data loaded:", { sheets: sheetsList.length, items: Object.values(allSheetsData).reduce((a,b) => a + b.length, 0) });
            
        } catch(error) {
            console.error(error);
            content.innerHTML = `<div class="empty-state"><span style="font-size:48px;">⚠️</span><p>Gagal memuat data</p><button onclick="location.reload()" class="refresh-btn" style="margin-top:16px;">Refresh</button></div>`;
        }
    }

    // ========================================
    // SIDEBAR
    // ========================================
    function loadSidebar() {
        const menu = document.getElementById("sidebarMenu");
        
        let html = `
            <li class="menu-item active" data-view="dashboard">
                <span>📊</span> Dashboard
            </li>
            <li class="menu-item" data-view="ebook">
                <span>📚</span> Perpustakaan
            </li>
        `;
        
        const otherSheets = sheetsList.filter(s => s !== 'Ebook');
        if (otherSheets.length > 0) {
            html += `<li class="menu-separator">━━ DATABASE LAIN ━━</li>`;
            otherSheets.forEach(sheet => {
                html += `<li class="menu-item" data-sheet="${sheet}"><span>📄</span> ${escapeHtml(sheet)}</li>`;
            });
        }
        
        menu.innerHTML = html;
        
        document.querySelectorAll('.menu-item[data-view], .menu-item[data-sheet]').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
                item.classList.add('active');
                
                if (item.dataset.view === 'dashboard') {
                    currentView = 'dashboard';
                    document.getElementById('pageTitle').innerText = 'Dashboard';
                    loadDashboard();
                } else if (item.dataset.view === 'ebook') {
                    currentView = 'ebook';
                    document.getElementById('pageTitle').innerText = '📚 Perpustakaan';
                    showEbookList();
                } else if (item.dataset.sheet) {
                    currentView = 'sheet';
                    document.getElementById('pageTitle').innerText = item.dataset.sheet;
                    loadSheet(item.dataset.sheet);
                }
                
                document.getElementById('searchInput').value = '';
                document.getElementById('clearSearchBtn').classList.remove('show');
                if (window.innerWidth <= 768) toggleSidebar(false);
            });
        });
    }

    // ========================================
    // DASHBOARD
    // ========================================
    function loadDashboard() {
        let totalItems = 0;
        for (const sheet of sheetsList) {
            totalItems += allSheetsData[sheet]?.length || 0;
        }
        
        const html = `
            <div style="padding:24px;">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number">${sheetsList.length}</div>
                        <div>Database</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${allSheetsData.Ebook?.length || 0}</div>
                        <div>Total Ebook</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${totalItems}</div>
                        <div>Total Items</div>
                    </div>
                </div>
                <div class="stat-card">
                    <h3 style="margin-bottom:16px;">📊 Statistik per Database</h3>
                    ${sheetsList.map(sheet => `
                        <div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border-color);">
                            <span>📄 ${escapeHtml(sheet)}</span>
                            <span style="color:var(--accent);">${allSheetsData[sheet]?.length || 0} items</span>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
        document.getElementById('content').innerHTML = html;
    }

    // ========================================
    // EBOOK LIST
    // ========================================
    function showEbookList() {
        const ebookData = allSheetsData.Ebook || [];
        
        if (!ebookData.length) {
            document.getElementById('content').innerHTML = `<div class="empty-state"><span style="font-size:48px;">📚</span><p>Belum ada ebook</p></div>`;
            return;
        }
        
        let html = `<div class="ebook-grid">`;
        ebookData.forEach((ebook, idx) => {
            const judul = ebook.Judul || ebook.title || "Tanpa Judul";
            const penulis = ebook.Penulis || ebook.author || "Unknown";
            const kategori = ebook.Kategori || ebook.category || "Umum";
            
            html += `
                <div class="ebook-card" onclick="openEbookReader(${idx})">
                    <div class="ebook-cover">📖</div>
                    <div class="ebook-info">
                        <div class="ebook-title">${escapeHtml(judul)}</div>
                        <div class="ebook-author">✍️ ${escapeHtml(penulis)}</div>
                        <span class="ebook-category">📁 ${escapeHtml(kategori)}</span>
                    </div>
                </div>
            `;
        });
        html += `</div>`;
        document.getElementById('content').innerHTML = html;
    }

    // ========================================
    // SHEET VIEWER
    // ========================================
    function loadSheet(sheetName) {
        const data = allSheetsData[sheetName] || [];
        
        if (!data.length) {
            document.getElementById('content').innerHTML = `<div class="empty-state"><p>Tidak ada data di ${escapeHtml(sheetName)}</p></div>`;
            return;
        }
        
        const headers = Object.keys(data[0]);
        let html = `<div style="padding:24px; overflow-x:auto;">
            <table class="data-table">
                <thead><tr>${headers.map(h => `<th>${escapeHtml(h)}</th>`).join('')} </thead>
                <tbody>
        `;
        
        data.forEach((item, idx) => {
            html += `<tr onclick="showDetail('${sheetName}', ${idx})">`;
            headers.forEach(h => {
                let val = item[h] || "";
                val = val.length > 50 ? val.substring(0, 50) + "..." : val;
                html += `<td>${escapeHtml(val)}</td>`;
            });
            html += `</tr>`;
        });
        
        html += `</tbody></table></div>`;
        document.getElementById('content').innerHTML = html;
    }

    function showDetail(sheetName, idx) {
        const item = allSheetsData[sheetName][idx];
        if (!item) return;
        
        const modal = document.getElementById('detailModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        
        modalTitle.innerHTML = `📋 ${escapeHtml(sheetName)}`;
        
        let bodyHtml = '';
        for (const [key, val] of Object.entries(item)) {
            let displayVal = val;
            if (typeof val === 'string' && (val.includes('drive.google.com') || val.includes('http'))) {
                displayVal = `<a href="${val}" target="_blank">🔗 ${escapeHtml(val)}</a>`;
            }
            bodyHtml += `
                <div class="detail-row">
                    <div style="font-weight:600; color:var(--accent); margin-bottom:4px;">${escapeHtml(key)}</div>
                    <div>${displayVal}</div>
                </div>
            `;
        }
        modalBody.innerHTML = bodyHtml;
        modal.classList.add('active');
    }

    function closeModal() {
        document.getElementById('detailModal').classList.remove('active');
    }

    // ========================================
    // SLIDE READER - SEPERTI MEMBACA BUKU
    // ========================================
    let currentSlideIndex = 0;
    let totalSlides = 0;
    let slideContainer = null;
    let slideWrapper = null;
    let touchStartX = 0;
    let touchEndX = 0;

    async function openEbookReader(idx) {
        const ebook = allSheetsData.Ebook?.[idx];
        if (!ebook || !ebook.File) {
            showToast("File tidak tersedia");
            return;
        }
        
        const judul = ebook.Judul || ebook.title || "Ebook";
        const fileUrl = ebook.File;
        
        // Sembunyikan konten utama
        document.getElementById('content').style.display = 'none';
        document.querySelector('.search-container').style.display = 'none';
        document.getElementById('pageTitle').innerText = `📖 ${judul.substring(0, 40)}`;
        
        // Tampilkan reader
        const readerHtml = `
            <div class="reader-container" id="readerContainer">
                <div class="reader-toolbar">
                    <button onclick="closeEbookReader()">← Tutup Buku</button>
                    <button id="fullscreenBtn">🖥️ Layar Penuh</button>
                    <button id="themeReaderBtn">🎨 Mode Malam</button>
                    <select id="zoomSelect">
                        <option value="100">Ukuran 100%</option>
                        <option value="80">Ukuran 80%</option>
                        <option value="120">Ukuran 120%</option>
                    </select>
                </div>
                <div class="slide-container" id="slideContainer">
                    <div class="slide-wrapper" id="slideWrapper">
                        <div class="loading" style="width:100%; display:flex; justify-content:center; align-items:center;">
                            <div class="spinner"></div>
                            <p>Memuat halaman...</p>
                        </div>
                    </div>
                </div>
                <div class="slide-nav" id="slideNav">
                    <button id="prevBtn" disabled>◀</button>
                    <span id="pageInfo">Halaman 0 / 0</span>
                    <button id="nextBtn" disabled>▶</button>
                </div>
                <div class="reader-progress" id="readerProgress">
                    <div class="reader-progress-fill" id="progressFill"></div>
                </div>
                <div class="swipe-hint" id="swipeHint">👆 Geser kiri/kanan untuk ganti halaman</div>
            </div>
        `;
        
        document.body.insertAdjacentHTML('beforeend', readerHtml);
        
        // Setup event listeners
        document.getElementById('fullscreenBtn')?.addEventListener('click', () => {
            document.getElementById('readerContainer')?.requestFullscreen();
        });
        
        document.getElementById('themeReaderBtn')?.addEventListener('click', () => {
            const container = document.getElementById('readerContainer');
            const isDark = container.style.background === 'rgb(26, 26, 26)' || container.style.background === '#1a1a1a';
            container.style.background = isDark ? 'var(--reader-bg)' : '#1a1a1a';
            container.style.color = isDark ? 'var(--reader-text)' : '#e0e0e0';
        });
        
        // Load PDF dengan slide
        await loadPDFToSlide(fileUrl);
    }
    
    async function loadPDFToSlide(fileUrl) {
        const slideWrapper = document.getElementById('slideWrapper');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const pageInfo = document.getElementById('pageInfo');
        const progressFill = document.getElementById('progressFill');
        
        slideWrapper.innerHTML = '<div class="loading"><div class="spinner"></div><p>Memuat PDF...</p></div>';
        
        try {
            // Konversi Google Drive link ke direct download
            let pdfUrl = fileUrl;
            const match = fileUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (match) {
                pdfUrl = `https://drive.google.com/uc?export=download&id=${match[1]}`;
            }
            
            const loadingTask = pdfjsLib.getDocument(pdfUrl);
            const pdf = await loadingTask.promise;
            totalSlides = pdf.numPages;
            currentSlideIndex = 0;
            
            pageInfo.innerText = `Halaman 1 / ${totalSlides}`;
            
            // Render semua halaman
            slideWrapper.innerHTML = '';
            
            for (let i = 1; i <= totalSlides; i++) {
                const page = await pdf.getPage(i);
                const viewport = page.getViewport({ scale: 1.2 });
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                canvas.style.maxWidth = '100%';
                canvas.style.height = 'auto';
                canvas.style.display = 'block';
                canvas.style.margin = '0 auto';
                
                await page.render({ canvasContext: context, viewport: viewport }).promise;
                
                const pageDiv = document.createElement('div');
                pageDiv.className = 'slide-page pdf-canvas-page';
                pageDiv.appendChild(canvas);
                slideWrapper.appendChild(pageDiv);
            }
            
            // Setup slide navigation
            const slideContainer = document.getElementById('slideContainer');
            slideWrapper = document.getElementById('slideWrapper');
            
            function updateSlidePosition() {
                const offset = -currentSlideIndex * 100;
                slideWrapper.style.transform = `translateX(${offset}%)`;
                pageInfo.innerText = `Halaman ${currentSlideIndex + 1} / ${totalSlides}`;
                
                prevBtn.disabled = currentSlideIndex === 0;
                nextBtn.disabled = currentSlideIndex === totalSlides - 1;
                
                // Update progress
                const progressPercent = ((currentSlideIndex + 1) / totalSlides) * 100;
                progressFill.style.width = `${progressPercent}%`;
                
                // Simpan progress
                localStorage.setItem(`ebook_progress_${fileUrl}`, currentSlideIndex);
            }
            
            prevBtn.onclick = () => {
                if (currentSlideIndex > 0) {
                    currentSlideIndex--;
                    updateSlidePosition();
                }
            };
            
            nextBtn.onclick = () => {
                if (currentSlideIndex < totalSlides - 1) {
                    currentSlideIndex++;
                    updateSlidePosition();
                }
            };
            
            // Touch events untuk swipe (mobile)
            slideContainer.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            });
            
            slideContainer.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                const swipeDistance = touchEndX - touchStartX;
                
                if (Math.abs(swipeDistance) > 50) {
                    if (swipeDistance > 0 && currentSlideIndex > 0) {
                        currentSlideIndex--;
                        updateSlidePosition();
                    } else if (swipeDistance < 0 && currentSlideIndex < totalSlides - 1) {
                        currentSlideIndex++;
                        updateSlidePosition();
                    }
                }
            });
            
            // Load saved progress
            const savedProgress = localStorage.getItem(`ebook_progress_${fileUrl}`);
            if (savedProgress) {
                currentSlideIndex = parseInt(savedProgress);
                updateSlidePosition();
            }
            
            updateSlidePosition();
            
            // Sembunyikan hint setelah 3 detik
            setTimeout(() => {
                const hint = document.getElementById('swipeHint');
                if (hint) hint.style.opacity = '0';
            }, 3000);
            
        } catch(error) {
            console.error('PDF load error:', error);
            slideWrapper.innerHTML = `<div class="empty-state"><p>❌ Gagal memuat PDF</p><p>${error.message}</p></div>`;
        }
    }
    
    window.closeEbookReader = function() {
        const reader = document.getElementById('readerContainer');
        if (reader) reader.remove();
        document.getElementById('content').style.display = 'block';
        document.querySelector('.search-container').style.display = 'block';
        document.getElementById('pageTitle').innerText = '📚 Perpustakaan';
        showEbookList();
    };

    // ========================================
    // SEARCH
    // ========================================
    let searchTimeout;
    
    function initSearch() {
        const input = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearSearchBtn');
        
        input.addEventListener('input', (e) => {
            const keyword = e.target.value;
            
            if (keyword.length > 0) {
                clearBtn.classList.add('show');
            } else {
                clearBtn.classList.remove('show');
            }
            
            if (searchTimeout) clearTimeout(searchTimeout);
            
            searchTimeout = setTimeout(() => {
                if (keyword.length < 2) {
                    if (currentView === 'dashboard') loadDashboard();
                    else if (currentView === 'ebook') showEbookList();
                    else if (currentView === 'sheet') loadSheet(document.getElementById('pageTitle').innerText);
                    return;
                }
                searchLocal(keyword);
            }, 300);
        });
        
        clearBtn.addEventListener('click', () => {
            input.value = '';
            clearBtn.classList.remove('show');
            if (currentView === 'dashboard') loadDashboard();
            else if (currentView === 'ebook') showEbookList();
            else if (currentView === 'sheet') loadSheet(document.getElementById('pageTitle').innerText);
        });
    }

    function searchLocal(keyword) {
        const lowerKeyword = keyword.toLowerCase();
        const results = [];
        
        for (const [sheet, data] of Object.entries(allSheetsData)) {
            for (const item of data) {
                let found = false;
                for (const val of Object.values(item)) {
                    if (val && String(val).toLowerCase().includes(lowerKeyword)) {
                        found = true;
                        break;
                    }
                }
                if (found) {
                    results.push({ sheet, data: item });
                }
            }
        }
        
        displaySearchResults(results, keyword);
    }

    function displaySearchResults(results, keyword) {
        if (!results.length) {
            document.getElementById('content').innerHTML = `<div class="empty-state"><p>Tidak ada hasil untuk "${escapeHtml(keyword)}"</p></div>`;
            return;
        }
        
        let html = `<div class="ebook-grid">`;
        results.forEach(result => {
            const title = Object.values(result.data)[0] || "Item";
            html += `
                <div class="ebook-card" onclick='showDetail("${result.sheet}", ${allSheetsData[result.sheet].findIndex(i => i === result.data)})'>
                    <div class="ebook-cover">🔍</div>
                    <div class="ebook-info">
                        <div class="ebook-title">${escapeHtml(title)}</div>
                        <div class="ebook-author">📁 ${escapeHtml(result.sheet)}</div>
                    </div>
                </div>
            `;
        });
        html += `</div>`;
        document.getElementById('content').innerHTML = html;
    }

    // ========================================
    // UTILITIES
    // ========================================
    function toggleSidebar(show) {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        if (show) {
            sidebar.classList.add('open');
            overlay.classList.add('active');
        } else {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        }
    }

    async function refreshData() {
        showToast("Mengambil data terbaru...");
        dataLoaded = false;
        await loadAllData();
    }

    // ========================================
    // INIT
    // ========================================
    document.addEventListener('DOMContentLoaded', () => {
        const mobileBtn = document.getElementById('mobileMenuBtn');
        const overlay = document.getElementById('sidebarOverlay');
        const refreshBtn = document.getElementById('refreshBtn');
        const themeToggleBtn = document.getElementById('themeToggle');
        
        mobileBtn.onclick = () => toggleSidebar(true);
        overlay.onclick = () => toggleSidebar(false);
        refreshBtn.onclick = () => refreshData();
        themeToggleBtn.onclick = () => toggleTheme();
        
        initTheme();
        loadAllData();
        initSearch();
    });
</script>
</body>
</html>
