<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Creator Vault - Digital Library</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #f8f9fc;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #2c3e50;
            --text-secondary: #6c757d;
            --text-muted: #adb5bd;
            --border-color: #e9ecef;
            --accent: #4361ee;
            --accent-dark: #3a56d4;
            --accent-light: #e8ecfb;
            --success: #2ecc71;
            --warning: #f39c12;
            --danger: #e74c3c;
            --sidebar-bg: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            --sidebar-text: #ffffff;
            --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-2: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --gradient-3: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        body.dark {
            --bg-primary: #121212;
            --bg-secondary: #1e1e1e;
            --bg-card: #252525;
            --text-primary: #e0e0e0;
            --text-secondary: #aaaaaa;
            --border-color: #333333;
            --accent: #5d7eff;
            --accent-light: #2a2a4a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            color: var(--sidebar-text);
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            overflow-y: auto;
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .sidebar-header {
            padding: 20px 16px;
            font-size: 18px;
            font-weight: 700;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu {
            list-style: none;
            padding: 12px;
        }

        .menu-item {
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 4px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }

        .menu-item:hover {
            background: rgba(255,255,255,0.1);
        }

        .menu-item.active {
            background: var(--accent);
        }

        .menu-separator {
            padding: 12px 16px 6px;
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            letter-spacing: 1px;
        }

        /* Main Content */
        .main {
            flex: 1;
            margin-left: 260px;
            min-height: 100vh;
        }

        /* Top Bar */
        .top-bar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .page-title {
            font-size: 20px;
            font-weight: 600;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            width: 38px;
            height: 38px;
            border-radius: 38px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
        }

        /* Search Bar */
        .search-bar {
            padding: 12px 24px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .search-wrapper {
            display: flex;
            align-items: center;
            background: var(--bg-primary);
            border-radius: 12px;
            padding: 10px 16px;
            gap: 10px;
            border: 1px solid var(--border-color);
        }

        .search-wrapper input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 14px;
            color: var(--text-primary);
            outline: none;
        }

        /* Hero Section */
        .hero-section {
            background: var(--gradient-1);
            margin: 20px;
            border-radius: 24px;
            padding: 32px;
            color: white;
            text-align: center;
        }

        .hero-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        /* Stats Row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin: 20px;
        }

        .stat-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent);
        }

        /* Article Grid (Beranda) */
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin: 20px 20px 12px;
        }

        .article-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin: 0 20px 20px;
        }

        .article-card {
            background: var(--bg-card);
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: all 0.3s;
        }

        .article-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.1);
            border-color: var(--accent);
        }

        .article-image {
            height: 160px;
            background: var(--gradient-2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }

        .article-content {
            padding: 16px;
        }

        .article-title {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 8px;
        }

        .article-excerpt {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .article-category {
            display: inline-block;
            background: var(--accent-light);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            margin-top: 12px;
        }

        /* HTML Viewer (Artikel) */
        .html-viewer {
            background: var(--bg-card);
            margin: 20px;
            border-radius: 20px;
            overflow: hidden;
        }

        .html-viewer-header {
            padding: 16px 20px;
            background: var(--accent);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .html-viewer-content {
            padding: 32px;
            max-width: 800px;
            margin: 0 auto;
            font-family: 'Georgia', serif;
            line-height: 1.8;
        }

        /* Full Screen PDF Viewer */
        .fullscreen-viewer {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #1a1a2e;
            z-index: 2000;
            display: none;
            flex-direction: column;
        }

        .fullscreen-viewer.active {
            display: flex;
        }

        .viewer-header {
            background: #1a1a2e;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .viewer-controls {
            display: flex;
            gap: 12px;
        }

        .viewer-controls button {
            background: rgba(255,255,255,0.2);
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
        }

        .viewer-content {
            flex: 1;
            overflow-y: auto;
            background: #2a2a3e;
            padding: 20px;
            text-align: center;
        }

        .pdf-page {
            background: white;
            margin: 0 auto 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1500;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            max-height: 70vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 16px;
        }

        /* Bottom Navigation */
        .bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 8px 12px;
            z-index: 100;
        }

        .bottom-nav-items {
            display: flex;
            justify-content: space-around;
        }

        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 8px;
            color: var(--text-secondary);
        }

        .bottom-nav-item.active {
            color: var(--accent);
            background: var(--accent-light);
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            z-index: 2500;
            animation: fadeInOut 2s ease;
            font-size: 12px;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }

        /* Mobile */
        .mobile-menu-btn {
            display: none;
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 1001;
            background: var(--accent);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
            color: white;
            align-items: center;
            justify-content: center;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 998;
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main {
                margin-left: 0;
                padding-bottom: 60px;
            }
            .bottom-nav {
                display: block;
            }
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
                margin: 12px;
                gap: 12px;
            }
            .article-grid {
                grid-template-columns: 1fr;
                margin: 0 12px 20px;
            }
            .hero-section {
                margin: 12px;
                padding: 24px;
            }
            .hero-title {
                font-size: 22px;
            }
            .mobile-menu-btn {
                display: flex;
            }
            .top-bar {
                padding: 10px 16px;
            }
            .page-title {
                font-size: 18px;
                margin-left: 44px;
            }
        }
    </style>
</head>
<body>

<button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div style="display: flex; min-height: 100vh;">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>🏦</span>
            <span>Creator Vault</span>
        </div>
        <ul class="menu" id="sidebarMenu">
            <li class="menu-separator">━━ MENU ━━</li>
        </ul>
    </aside>

    <main class="main">
        <div class="top-bar">
            <h1 class="page-title" id="pageTitle">Beranda</h1>
            <div class="header-actions">
                <button class="icon-btn" id="themeToggle">🌙</button>
                <button class="icon-btn" id="refreshBtn">🔄</button>
            </div>
        </div>

        <div class="search-bar">
            <div class="search-wrapper">
                <span>🔍</span>
                <input type="text" id="searchInput" placeholder="Cari artikel, template, atau dokumen..." autocomplete="off">
            </div>
            <div id="searchResults"></div>
        </div>

        <div id="content"></div>
    </main>
</div>

<div class="bottom-nav" id="bottomNav">
    <div class="bottom-nav-items">
        <div class="bottom-nav-item" data-nav="beranda">
            <span>🏠</span>
            <span>Beranda</span>
        </div>
        <div class="bottom-nav-item" data-nav="library">
            <span>📚</span>
            <span>Library</span>
        </div>
        <div class="bottom-nav-item" data-nav="template">
            <span>💬</span>
            <span>Template</span>
        </div>
        <div class="bottom-nav-item" data-nav="saya">
            <span>👤</span>
            <span>Saya</span>
        </div>
    </div>
</div>

<!-- Full Screen PDF Viewer (untuk PDF Gambar) -->
<div class="fullscreen-viewer" id="pdfViewer">
    <div class="viewer-header">
        <span id="pdfTitle">Dokumen</span>
        <div class="viewer-controls">
            <button onclick="pdfPrevPage()">◀</button>
            <span id="pdfPageInfo">1 / 1</span>
            <button onclick="pdfNextPage()">▶</button>
            <button onclick="pdfZoomIn()">🔍+</button>
            <button onclick="pdfZoomOut()">🔍-</button>
            <button onclick="closePDFViewer()" style="background:#e74c3c;">✕ Tutup</button>
        </div>
    </div>
    <div class="viewer-content" id="pdfContent">
        <div class="loading"><div class="spinner"></div><p>Memuat dokumen...</p></div>
    </div>
</div>

<!-- Modal Detail -->
<div class="modal" id="detailModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Detail</h3>
            <button onclick="closeModal()" style="background:none;border:none;font-size:20px;cursor:pointer;">✕</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
    </div>
</div>

<script>
    // ========================================
    // KONFIGURASI
    // ========================================
    const API_URL = "https://script.google.com/macros/s/AKfycbxtkfn059eEdHCPKPeYMu5UL0HyAYtMz7MWb5kQoqmJM1PIDG1RA64AxArCAqQLs_IG/exec";
    
    let allSheetsData = {};
    let allItemsForSearch = [];
    let sheetsList = [];
    let currentView = "beranda";
    let isLoading = false;
    let isDarkMode = localStorage.getItem('theme') === 'dark';
    
    // PDF State
    let pdfDoc = null;
    let pdfCurrentPage = 1;
    let pdfTotalPages = 0;
    let pdfCurrentScale = 1.5;

    // ========================================
    // THEME
    // ========================================
    function initTheme() {
        if (isDarkMode) {
            document.body.classList.add('dark');
            document.getElementById('themeToggle').innerHTML = '☀️';
        } else {
            document.getElementById('themeToggle').innerHTML = '🌙';
        }
    }

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        if (isDarkMode) {
            document.body.classList.add('dark');
            localStorage.setItem('theme', 'dark');
            document.getElementById('themeToggle').innerHTML = '☀️';
        } else {
            document.body.classList.remove('dark');
            localStorage.setItem('theme', 'light');
            document.getElementById('themeToggle').innerHTML = '🌙';
        }
    }

    // ========================================
    // PDF VIEWER (untuk PDF Gambar)
    // ========================================
    async function openPDFViewer(url, title) {
        const viewer = document.getElementById('pdfViewer');
        const pdfTitle = document.getElementById('pdfTitle');
        const pdfContent = document.getElementById('pdfContent');
        
        pdfTitle.innerHTML = `📄 ${title}`;
        viewer.classList.add('active');
        pdfContent.innerHTML = `<div class="loading"><div class="spinner"></div><p>Memuat PDF...</p></div>`;
        
        try {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
            const pdf = await pdfjsLib.getDocument(url).promise;
            pdfDoc = pdf;
            pdfTotalPages = pdf.numPages;
            pdfCurrentPage = 1;
            document.getElementById('pdfPageInfo').innerText = `1 / ${pdfTotalPages}`;
            await renderPDFPage();
        } catch(e) {
            pdfContent.innerHTML = `<div style="text-align:center;padding:40px;"><p>❌ Gagal memuat PDF</p><button onclick="closePDFViewer()" style="margin-top:16px;">Tutup</button></div>`;
        }
    }
    
    async function renderPDFPage() {
        if (!pdfDoc) return;
        const page = await pdfDoc.getPage(pdfCurrentPage);
        const viewport = page.getViewport({ scale: pdfCurrentScale });
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        canvas.className = 'pdf-page';
        canvas.style.maxWidth = '100%';
        canvas.style.height = 'auto';
        await page.render({ canvasContext: context, viewport: viewport }).promise;
        const container = document.getElementById('pdfContent');
        container.innerHTML = '';
        container.appendChild(canvas);
        document.getElementById('pdfPageInfo').innerText = `${pdfCurrentPage} / ${pdfTotalPages}`;
    }
    
    function pdfPrevPage() { if (pdfCurrentPage > 1) { pdfCurrentPage--; renderPDFPage(); } }
    function pdfNextPage() { if (pdfCurrentPage < pdfTotalPages) { pdfCurrentPage++; renderPDFPage(); } }
    function pdfZoomIn() { pdfCurrentScale += 0.2; renderPDFPage(); }
    function pdfZoomOut() { pdfCurrentScale = Math.max(0.5, pdfCurrentScale - 0.2); renderPDFPage(); }
    function closePDFViewer() { document.getElementById('pdfViewer').classList.remove('active'); pdfDoc = null; }

    // ========================================
    // HTML VIEWER (untuk EPUB & PDF Teks)
    // ========================================
    function showHTMLViewer(title, content) {
        const container = document.getElementById('content');
        container.innerHTML = `
            <div class="html-viewer">
                <div class="html-viewer-header">
                    <span>📖 ${escapeHtml(title)}</span>
                    <button class="icon-btn" onclick="showBeranda()" style="background:rgba(255,255,255,0.2);color:white;">← Kembali</button>
                </div>
                <div class="html-viewer-content">
                    ${content}
                </div>
            </div>
        `;
    }

    // ========================================
    // API FUNCTIONS
    // ========================================
    async function getSheets() {
        const res = await fetch(`${API_URL}?action=sheets`);
        const data = await res.json();
        return Array.isArray(data) ? data : [];
    }

    async function getSheetData(sheetName) {
        const res = await fetch(`${API_URL}?action=data&sheet=${encodeURIComponent(sheetName)}`);
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0 && Array.isArray(data[0])) {
            const headers = data[0];
            const rows = data.slice(1);
            return rows.map(row => {
                const obj = {};
                headers.forEach((h, i) => obj[h] = row[i] || "");
                return obj;
            });
        }
        return Array.isArray(data) ? data : [];
    }

    // ========================================
    // LOAD ALL DATA
    // ========================================
    async function loadAllData(showToastMsg = false) {
        if (isLoading) return;
        isLoading = true;
        
        const content = document.getElementById('content');
        content.innerHTML = `<div class="loading"><div class="spinner"></div><p>Memuat data...</p></div>`;
        
        try {
            sheetsList = await getSheets();
            const promises = sheetsList.map(async sheet => {
                const data = await getSheetData(sheet);
                return { sheet, data };
            });
            const results = await Promise.all(promises);
            
            allItemsForSearch = [];
            results.forEach(result => {
                allSheetsData[result.sheet] = result.data;
                result.data.forEach((item, idx) => {
                    allItemsForSearch.push({
                        sheet: result.sheet,
                        index: idx,
                        data: item,
                        title: Object.values(item)[0] || "Tanpa judul"
                    });
                });
            });
            
            await loadSidebar();
            await showBeranda();
            
            if (showToastMsg) showToast('✅ Data diperbarui');
        } catch(error) {
            console.error(error);
            content.innerHTML = `<div class="loading"><p>⚠️ Gagal memuat data</p><button class="icon-btn" onclick="location.reload()" style="margin-top:16px;">Refresh</button></div>`;
        } finally {
            isLoading = false;
        }
    }

    // ========================================
    // SIDEBAR
    // ========================================
    async function loadSidebar() {
        const menu = document.getElementById("sidebarMenu");
        const icons = { "Ebook": "📚", "Produk": "🛒", "TemplateChat": "💬", "Affiliate": "🔗", "PromptAI": "🧠", "IdeKonten": "💡", "Notes": "📝" };
        
        menu.innerHTML = `
            <li class="menu-item" data-view="beranda"><span>🏠</span> Beranda</li>
            <li class="menu-item" data-view="library"><span>📚</span> Library</li>
            <li class="menu-separator">━━ KATEGORI ━━</li>
            ${sheetsList.map(sheet => `<li class="menu-item" data-sheet="${sheet}"><span>${icons[sheet] || "📄"}</span> ${escapeHtml(sheet)}</li>`).join('')}
        `;
        
        document.querySelectorAll('.menu-item[data-view], .menu-item[data-sheet]').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
                item.classList.add('active');
                const view = item.dataset.view;
                const sheet = item.dataset.sheet;
                if (view === 'beranda') { currentView = 'beranda'; document.getElementById('pageTitle').innerText = 'Beranda'; showBeranda(); }
                else if (view === 'library') { currentView = 'library'; document.getElementById('pageTitle').innerText = 'Library'; showLibrary(); }
                else if (sheet) { currentView = 'sheet'; document.getElementById('pageTitle').innerText = sheet; showSheetData(sheet); }
                document.getElementById('searchInput').value = '';
                document.getElementById('searchResults').innerHTML = '';
                if (window.innerWidth <= 768) toggleSidebar(false);
            });
        });
        
        document.querySelectorAll('.bottom-nav-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.bottom-nav-item').forEach(n => n.classList.remove('active'));
                item.classList.add('active');
                const nav = item.dataset.nav;
                if (nav === 'beranda') { showBeranda(); }
                else if (nav === 'library') { showLibrary(); }
                else if (nav === 'template') { showSheetData('TemplateChat'); }
                else if (nav === 'saya') { showProfile(); }
            });
        });
        
        document.querySelector('.menu-item[data-view="beranda"]').classList.add('active');
    }

    // ========================================
    // BERANDA (Artikel)
    // ========================================
    function showBeranda() {
        const ebooks = allSheetsData['Ebook'] || [];
        const templates = allSheetsData['TemplateChat'] || [];
        const prompts = allSheetsData['PromptAI'] || [];
        const totalItems = Object.values(allSheetsData).reduce((sum, data) => sum + data.length, 0);
        
        let articlesHtml = '';
        // Artikel dari Ebook
        ebooks.slice(0, 6).forEach((ebook, idx) => {
            const title = ebook.judul || ebook.title || `Ebook ${idx + 1}`;
            const desc = ebook.deskripsi || ebook.keterangan || 'Klik untuk membaca ebook ini';
            articlesHtml += `
                <div class="article-card" onclick="openDocument('Ebook', ${idx})">
                    <div class="article-image">📚</div>
                    <div class="article-content">
                        <div class="article-title">${escapeHtml(title.substring(0, 50))}</div>
                        <div class="article-excerpt">${escapeHtml(desc.substring(0, 100))}</div>
                        <span class="article-category">Ebook</span>
                    </div>
                </div>
            `;
        });
        
        // Artikel dari Template Chat
        templates.slice(0, 3).forEach((template, idx) => {
            const title = Object.values(template)[0] || `Template ${idx + 1}`;
            const desc = template.jawaban ? template.jawaban.substring(0, 100) : 'Template chat untuk bisnis';
            articlesHtml += `
                <div class="article-card" onclick="showItemDetail('TemplateChat', ${idx})">
                    <div class="article-image">💬</div>
                    <div class="article-content">
                        <div class="article-title">${escapeHtml(title.substring(0, 50))}</div>
                        <div class="article-excerpt">${escapeHtml(desc)}</div>
                        <span class="article-category">Template Chat</span>
                    </div>
                </div>
            `;
        });
        
        const html = `
            <div class="hero-section">
                <div class="hero-title">Creator Vault</div>
                <p>Personal Knowledge Hub & Digital Library</p>
            </div>
            <div class="stats-row">
                <div class="stat-card"><div class="stat-value">${sheetsList.length}</div><div>Database</div></div>
                <div class="stat-card"><div class="stat-value">${totalItems}</div><div>Total Items</div></div>
                <div class="stat-card"><div class="stat-value">⚡</div><div>Ready</div></div>
            </div>
            <div class="section-title">📖 Artikel & Koleksi Terbaru</div>
            <div class="article-grid">${articlesHtml || '<div class="article-card"><div class="article-content">Belum ada artikel</div></div>'}</div>
        `;
        document.getElementById('content').innerHTML = html;
    }

    // ========================================
    // LIBRARY (Ebook)
    // ========================================
    function showLibrary() {
        const ebooks = allSheetsData['Ebook'] || [];
        if (!ebooks.length) {
            document.getElementById('content').innerHTML = `<div class="loading"><p>📭 Belum ada ebook</p></div>`;
            return;
        }
        
        let html = `<div class="article-grid">`;
        ebooks.forEach((ebook, idx) => {
            const title = ebook.judul || ebook.title || `Ebook ${idx + 1}`;
            const desc = ebook.deskripsi || ebook.keterangan || 'Klik untuk membaca';
            html += `
                <div class="article-card" onclick="openDocument('Ebook', ${idx})">
                    <div class="article-image">📚</div>
                    <div class="article-content">
                        <div class="article-title">${escapeHtml(title.substring(0, 50))}</div>
                        <div class="article-excerpt">${escapeHtml(desc.substring(0, 80))}</div>
                        <span class="article-category">Ebook</span>
                    </div>
                </div>
            `;
        });
        html += `</div>`;
        document.getElementById('content').innerHTML = html;
    }

    // ========================================
    // OPEN DOCUMENT (Auto Detect PDF Teks/PDF Gambar/EPUB)
    // ========================================
    async function openDocument(sheetName, idx) {
        const item = allSheetsData[sheetName][idx];
        const fileUrl = item.file || item.link || item.url || "";
        const title = item.judul || item.title || Object.values(item)[0] || "Dokumen";
        
        if (!fileUrl) {
            showItemDetail(sheetName, idx);
            return;
        }
        
        // Cek tipe file
        const isPDF = fileUrl.includes('.pdf') || fileUrl.includes('drive.google.com');
        const isEPUB = fileUrl.includes('.epub');
        
        if (isPDF) {
            // Coba cek apakah PDF teks (bisa ekstrak) atau PDF gambar
            // Untuk sementara, semua PDF pakai PDF Viewer dulu
            // nanti bisa ditambahkan deteksi dengan ekstrak teks
            openPDFViewer(fileUrl, title);
        } else if (isEPUB) {
            // EPUB bisa di-render sebagai HTML
            showToast('🔄 Memuat EPUB...');
            try {
                const book = ePub(fileUrl);
                await book.ready;
                let fullHtml = '<h1>' + escapeHtml(title) + '</h1>';
                const chapters = book.navigation;
                for (let i = 0; i < chapters.length && i < 20; i++) {
                    try {
                        const chapter = await book.getChapter(chapters[i].href);
                        fullHtml += chapter;
                    } catch(e) {}
                }
                showHTMLViewer(title, fullHtml);
            } catch(e) {
                showToast('❌ Gagal memuat EPUB');
                showItemDetail(sheetName, idx);
            }
        } else {
            showItemDetail(sheetName, idx);
        }
    }

    function showSheetData(sheetName) {
        const data = allSheetsData[sheetName] || [];
        if (!data.length) {
            document.getElementById('content').innerHTML = `<div class="loading"><p>📭 Tidak ada data</p></div>`;
            return;
        }
        
        let html = `<div class="article-grid">`;
        data.forEach((item, idx) => {
            const title = Object.values(item)[0] || "Item";
            html += `
                <div class="article-card" onclick="showItemDetail('${sheetName}', ${idx})">
                    <div class="article-image">📄</div>
                    <div class="article-content">
                        <div class="article-title">${escapeHtml(title.substring(0, 50))}</div>
                        <span class="article-category">${escapeHtml(sheetName)}</span>
                    </div>
                </div>
            `;
        });
        html += `</div>`;
        document.getElementById('content').innerHTML = html;
    }
    
    function showItemDetail(sheetName, idx) {
        const item = allSheetsData[sheetName][idx];
        if (!item) return;
        
        const modal = document.getElementById('detailModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        
        modalTitle.innerHTML = `📋 ${escapeHtml(sheetName)}`;
        let bodyHtml = '';
        for (const [key, val] of Object.entries(item)) {
            let displayVal = escapeHtml(String(val));
            if (typeof val === 'string' && (val.includes('.pdf') || val.includes('.epub'))) {
                displayVal += `<br><button class="icon-btn" style="margin-top:8px;background:var(--accent);color:white;" onclick="openDocument('${sheetName}', ${idx}); closeModal();">📖 Baca Dokumen</button>`;
            }
            bodyHtml += `<div class="detail-row" style="padding:8px 0;border-bottom:1px solid var(--border-color);"><div style="font-weight:600;color:var(--accent);">${escapeHtml(key)}</div><div style="margin-top:4px;">${displayVal}</div></div>`;
        }
        modalBody.innerHTML = bodyHtml;
        modal.classList.add('active');
    }
    
    function showProfile() {
        const totalItems = Object.values(allSheetsData).reduce((sum, data) => sum + data.length, 0);
        document.getElementById('content').innerHTML = `
            <div class="hero-section">
                <div class="hero-title">👤 Profile</div>
                <p>Creator Vault - Personal Knowledge Hub</p>
            </div>
            <div class="stats-row">
                <div class="stat-card"><div class="stat-value">${sheetsList.length}</div><div>Database</div></div>
                <div class="stat-card"><div class="stat-value">${totalItems}</div><div>Total Items</div></div>
            </div>
            <div class="article-grid">
                <div class="article-card"><div class="article-content"><div class="article-title">📚 Ebook Reader</div><div class="article-excerpt">Baca ebook langsung dari browser</div></div></div>
                <div class="article-card"><div class="article-content"><div class="article-title">💬 Template Chat</div><div class="article-excerpt">Koleksi template untuk bisnis</div></div></div>
                <div class="article-card"><div class="article-content"><div class="article-title">🧠 Prompt AI</div><div class="article-excerpt">Prompt untuk konten kreatif</div></div></div>
            </div>
        `;
    }

    // ========================================
    // SEARCH
    // ========================================
    let searchDebounce = null;
    
    function searchLocal(keyword) {
        if (!keyword || keyword.length < 2) return [];
        const lowerKeyword = keyword.toLowerCase();
        const results = [];
        for (const item of allItemsForSearch) {
            for (const val of Object.values(item.data)) {
                if (val && String(val).toLowerCase().includes(lowerKeyword)) {
                    results.push(item);
                    break;
                }
            }
        }
        return results;
    }
    
    function initSearch() {
        const input = document.getElementById('searchInput');
        const resultsDiv = document.getElementById('searchResults');
        
        input.addEventListener('input', (e) => {
            const keyword = e.target.value;
            if (searchDebounce) clearTimeout(searchDebounce);
            searchDebounce = setTimeout(() => {
                if (keyword.length < 2) {
                    resultsDiv.innerHTML = '';
                    return;
                }
                const results = searchLocal(keyword);
                if (!results.length) {
                    resultsDiv.innerHTML = `<div style="padding:16px;text-align:center;">😕 Tidak ada hasil</div>`;
                    return;
                }
                let html = `<div style="padding:16px;"><div class="article-grid">`;
                results.slice(0, 12).forEach(result => {
                    html += `
                        <div class="article-card" onclick="showItemDetail('${result.sheet}', ${result.index}); resultsDiv.innerHTML=''; input.value='';">
                            <div class="article-image">🔍</div>
                            <div class="article-content">
                                <div class="article-title">${escapeHtml(result.title.substring(0, 50))}</div>
                                <span class="article-category">${escapeHtml(result.sheet)}</span>
                            </div>
                        </div>
                    `;
                });
                html += `</div></div>`;
                resultsDiv.innerHTML = html;
            }, 200);
        });
    }

    // ========================================
    // UTILITIES
    // ========================================
    function escapeHtml(str) { if (!str) return ''; return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
    function showToast(message) { const toast = document.createElement("div"); toast.className = "toast"; toast.textContent = message; document.body.appendChild(toast); setTimeout(() => toast.remove(), 2000); }
    function toggleSidebar(show) { const sidebar = document.getElementById('sidebar'); const overlay = document.getElementById('sidebarOverlay'); if (show) { sidebar.classList.add('open'); overlay.classList.add('active'); } else { sidebar.classList.remove('open'); overlay.classList.remove('active'); } }
    async function manualRefresh() { if (isLoading) { showToast('⏳ Masih memuat...'); return; } showToast('🔄 Mengambil data terbaru...'); await loadAllData(true); }
    function closeModal() { document.getElementById('detailModal').classList.remove('active'); }

    // Global functions
    window.showBeranda = showBeranda;
    window.showLibrary = showLibrary;
    window.showSheetData = showSheetData;
    window.showItemDetail = showItemDetail;
    window.showProfile = showProfile;
    window.openDocument = openDocument;
    window.closeModal = closeModal;
    window.openPDFViewer = openPDFViewer;
    window.closePDFViewer = closePDFViewer;
    window.pdfPrevPage = pdfPrevPage;
    window.pdfNextPage = pdfNextPage;
    window.pdfZoomIn = pdfZoomIn;
    window.pdfZoomOut = pdfZoomOut;
    window.manualRefresh = manualRefresh;
    window.toggleTheme = toggleTheme;
    
    // INIT
    document.addEventListener('DOMContentLoaded', async () => {
        const mobileBtn = document.getElementById('mobileMenuBtn');
        const overlay = document.getElementById('sidebarOverlay');
        const refreshBtn = document.getElementById('refreshBtn');
        const themeToggleBtn = document.getElementById('themeToggle');
        mobileBtn.onclick = () => toggleSidebar(true);
        overlay.onclick = () => toggleSidebar(false);
        refreshBtn.onclick = () => manualRefresh();
        themeToggleBtn.onclick = () => toggleTheme();
        initTheme();
        await loadAllData(false);
        initSearch();
    });
</script>
</body>
</html>
