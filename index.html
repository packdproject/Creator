<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Creator Vault - Personal Knowledge Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== VARIABLES ===== */
        :root {
            --bg-primary: #f5f7fb;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #666666;
            --border-color: #eef2f6;
            --sidebar-bg: linear-gradient(180deg, #1a1a2e 0%, #0f0f1a 100%);
            --sidebar-text: #ffffff;
            --sidebar-hover: rgba(255,255,255,0.1);
            --accent: #4a9eff;
            --accent-hover: #3a7ecc;
            --message-bg: #ffffff;
            --message-bg-own: #dcf8c6;
            --message-text: #1a1a2e;
            --search-bg: #ffffff;
            --shadow: rgba(0,0,0,0.04);
        }

        body.dark {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-card: #1e1e1e;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --border-color: #2a2a2a;
            --sidebar-bg: linear-gradient(180deg, #0a0a0f 0%, #050508 100%);
            --sidebar-text: #e0e0e0;
            --accent: #4a9eff;
            --message-bg: #2a2a2a;
            --message-bg-own: #1e3a2a;
            --message-text: #ffffff;
            --search-bg: #2a2a2a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background 0.2s, color 0.2s;
        }

        /* Mobile Menu */
        .mobile-menu-btn {
            display: none;
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 1001;
            background: var(--accent);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            font-size: 22px;
            cursor: pointer;
            color: white;
            align-items: center;
            justify-content: center;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 998;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            color: var(--sidebar-text);
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            overflow-y: auto;
            transition: transform 0.3s ease;
            z-index: 999;
        }

        .sidebar-header {
            padding: 24px 20px;
            font-size: 20px;
            font-weight: 700;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .menu {
            list-style: none;
            padding: 16px 12px;
        }

        .menu-item {
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 4px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
        }

        .menu-item:hover {
            background: var(--sidebar-hover);
        }

        .menu-item.active {
            background: var(--accent);
        }

        .menu-separator {
            padding: 12px 16px 6px;
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            letter-spacing: 1px;
        }

        /* Main Content */
        .main {
            flex: 1;
            margin-left: 280px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .main-header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .main-header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .theme-toggle, .refresh-btn {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            width: 38px;
            height: 38px;
            border-radius: 38px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
        }

        .refresh-btn {
            width: auto;
            padding: 0 16px;
            gap: 6px;
            background: var(--accent);
            color: white;
            border: none;
        }

        /* Search Container - Like WhatsApp */
        .search-container {
            padding: 12px 24px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 60px;
            z-index: 99;
        }

        .search-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
            background: var(--search-bg);
            border-radius: 30px;
            padding: 4px 16px;
            border: 1px solid var(--border-color);
        }

        .search-wrapper span {
            font-size: 18px;
            color: var(--text-secondary);
        }

        .search-box {
            flex: 1;
            padding: 12px 0;
            border: none;
            background: transparent;
            font-size: 15px;
            color: var(--text-primary);
            outline: none;
        }

        .clear-search {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 4px;
            display: none;
        }

        .clear-search.show {
            display: block;
        }

        /* Dashboard Analytics */
        .analytics-container {
            padding: 24px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .stat-number {
            font-size: 36px;
            font-weight: 800;
            color: var(--accent);
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        /* Chat/Message Results - Like WhatsApp/Telegram */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 24px;
            background: var(--bg-primary);
        }

        .message-group {
            margin-bottom: 24px;
        }

        .message-date {
            text-align: center;
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .message-item {
            display: flex;
            margin-bottom: 16px;
            cursor: pointer;
            transition: background 0.2s;
            padding: 12px;
            border-radius: 16px;
        }

        .message-item:hover {
            background: var(--bg-card);
        }

        .message-avatar {
            width: 48px;
            height: 48px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .message-content {
            flex: 1;
        }

        .message-title {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 4px;
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
        }

        .message-sheet {
            font-size: 10px;
            color: var(--accent);
            background: var(--bg-primary);
            padding: 2px 8px;
            border-radius: 12px;
        }

        .message-preview {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .copy-message-btn {
            background: var(--accent);
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }

        .copy-message-btn:hover {
            background: var(--accent-hover);
        }

        /* Detail Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            border-radius: 28px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: var(--bg-card);
        }

        .modal-body {
            padding: 20px;
        }

        .detail-row {
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .detail-label {
            font-weight: 600;
            color: var(--accent);
            font-size: 12px;
            margin-bottom: 6px;
        }

        .detail-value {
            font-size: 14px;
            word-break: break-word;
        }

        .detail-value pre {
            background: var(--bg-primary);
            padding: 12px;
            border-radius: 12px;
            overflow-x: auto;
            font-family: monospace;
            font-size: 13px;
            margin-top: 6px;
        }

        .modal-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border-color);
            text-align: right;
        }

        .btn-copy {
            background: var(--accent);
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
        }

        /* Loading & Empty */
        .loading, .empty-state {
            text-align: center;
            padding: 60px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            z-index: 3000;
            animation: fadeInOut 2s ease;
            font-size: 13px;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .mobile-menu-btn {
                display: flex;
            }
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .sidebar-overlay.active {
                display: block;
            }
            .main {
                margin-left: 0;
            }
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .message-item {
                padding: 10px;
            }
            .message-avatar {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

<button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div style="display: flex; min-height: 100vh;">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>🏦 Creator Vault</span>
            <span style="font-size: 12px; opacity:0.6;">v2.0</span>
        </div>
        <ul class="menu" id="sidebarMenu">
            <li class="menu-separator">━━ MENU ━━</li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main">
        <div class="main-header">
            <h1 id="pageTitle">Dashboard</h1>
            <div class="header-actions">
                <button class="theme-toggle" id="themeToggle">🌙</button>
                <button class="refresh-btn" id="refreshBtn">🔄</button>
            </div>
        </div>

        <!-- Search Container -->
        <div class="search-container">
            <div class="search-wrapper">
                <span>🔍</span>
                <input type="text" id="searchInput" class="search-box" placeholder="Cari pesan atau template...">
                <button class="clear-search" id="clearSearchBtn">✕</button>
            </div>
        </div>

        <!-- Content Area -->
        <div id="content" class="chat-container">
            <div class="loading">
                <div class="spinner"></div>
                <p>Memuat data...</p>
            </div>
        </div>
    </main>
</div>

<!-- Detail Modal -->
<div class="modal" id="detailModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Detail Pesan</h3>
            <button class="close-modal" onclick="closeModal()" style="background:none;border:none;font-size:24px;cursor:pointer;">✕</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer">
            <button class="btn-copy" id="modalCopyBtn">📋 Salin Jawaban</button>
        </div>
    </div>
</div>

<script>
    // ========================================
    // KONFIGURASI
    // ========================================
    const API_URL = "https://script.google.com/macros/s/AKfycbxtkfn059eEdHCPKPeYMu5UL0HyAYtMz7MWb5kQoqmJM1PIDG1RA64AxArCAqQLs_IG/exec";
    
    // State
    let allSheetsData = {};
    let sheetsList = [];
    let currentView = "dashboard";
    let lastSearchResults = [];
    let isLoading = false;
    let isDarkMode = localStorage.getItem('theme') === 'dark';

    // ========================================
    // THEME
    // ========================================
    function initTheme() {
        if (isDarkMode) {
            document.body.classList.add('dark');
            document.getElementById('themeToggle').innerHTML = '☀️';
        } else {
            document.getElementById('themeToggle').innerHTML = '🌙';
        }
    }

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        if (isDarkMode) {
            document.body.classList.add('dark');
            localStorage.setItem('theme', 'dark');
            document.getElementById('themeToggle').innerHTML = '☀️';
        } else {
            document.body.classList.remove('dark');
            localStorage.setItem('theme', 'light');
            document.getElementById('themeToggle').innerHTML = '🌙';
        }
    }

    // ========================================
    // COPY FUNCTION (Column 4 / Jawaban)
    // ========================================
    async function copyAnswer(text, buttonElement) {
        try {
            await navigator.clipboard.writeText(text);
            const originalText = buttonElement.innerHTML;
            buttonElement.innerHTML = '✓ Tersalin!';
            setTimeout(() => {
                buttonElement.innerHTML = originalText;
            }, 1500);
            showToast('✅ Jawaban tersalin!');
        } catch(err) {
            showToast('❌ Gagal menyalin');
        }
    }

    function getAnswerFromItem(item) {
        // Cari kolom ke-4 atau field jawaban
        const values = Object.values(item);
        // Kolom ke-4 (index 3) jika ada
        if (values.length >= 4) {
            return values[3] || values[2] || values[1] || "";
        }
        // Atau cari field yang mengandung kata jawaban/answer
        for (let [key, val] of Object.entries(item)) {
            if (key.toLowerCase().includes('jawab') || key.toLowerCase().includes('answer')) {
                return val || "";
            }
        }
        // Ambil field terpanjang sebagai konten
        let longest = "";
        for (let val of values) {
            if (typeof val === 'string' && val.length > longest.length && val.length > 20) {
                longest = val;
            }
        }
        return longest || values[1] || "";
    }

    function showToast(message) {
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }

    // ========================================
    // API FUNCTIONS
    // ========================================
    async function getSheets() {
        const res = await fetch(`${API_URL}?action=sheets`);
        const data = await res.json();
        return Array.isArray(data) ? data : [];
    }

    async function getSheetData(sheetName) {
        const res = await fetch(`${API_URL}?action=data&sheet=${encodeURIComponent(sheetName)}`);
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0 && Array.isArray(data[0])) {
            const headers = data[0];
            const rows = data.slice(1);
            return rows.map(row => {
                const obj = {};
                headers.forEach((h, i) => obj[h] = row[i] || "");
                return obj;
            });
        }
        return Array.isArray(data) ? data : [];
    }

    async function searchData(keyword) {
        if (!keyword || keyword.length < 2) return [];
        const res = await fetch(`${API_URL}?action=search&q=${encodeURIComponent(keyword)}`);
        const data = await res.json();
        return Array.isArray(data) ? data : [];
    }

    // ========================================
    // LOAD ALL DATA
    // ========================================
    async function loadAllData(showToastMsg = false) {
        if (isLoading) return;
        isLoading = true;
        
        try {
            sheetsList = await getSheets();
            const promises = sheetsList.map(async sheet => {
                const data = await getSheetData(sheet);
                return { sheet, data };
            });
            const results = await Promise.all(promises);
            results.forEach(result => {
                allSheetsData[result.sheet] = result.data;
            });
            
            await loadSidebar();
            await showDashboard();
            
            if (showToastMsg) showToast('✅ Data diperbarui');
        } catch(error) {
            console.error(error);
            document.getElementById('content').innerHTML = `<div class="empty-state"><p>⚠️ Gagal memuat data</p><button class="refresh-btn" onclick="location.reload()" style="margin-top:16px;">Refresh</button></div>`;
        } finally {
            isLoading = false;
        }
    }

    // ========================================
    // SIDEBAR
    // ========================================
    async function loadSidebar() {
        const menu = document.getElementById("sidebarMenu");
        const icons = {
            "Ebook": "📚", "Produk": "🛒", "Pelanggan": "👥", "TemplateChat": "💬",
            "Affiliate": "🔗", "PromptAI": "🧠", "IdeKonten": "💡", "Notes": "📝"
        };
        
        menu.innerHTML = `
            <li class="menu-item" data-view="dashboard">
                <span>📊</span> Dashboard
            </li>
            <li class="menu-separator">━━ DATABASE ━━</li>
            ${sheetsList.map(sheet => `
                <li class="menu-item" data-sheet="${sheet}">
                    <span>${icons[sheet] || "📄"}</span> ${escapeHtml(sheet)}
                </li>
            `).join('')}
        `;
        
        document.querySelectorAll('.menu-item[data-view], .menu-item[data-sheet]').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
                item.classList.add('active');
                
                if (item.dataset.view === 'dashboard') {
                    currentView = 'dashboard';
                    document.getElementById('pageTitle').innerText = 'Dashboard';
                    showDashboard();
                } else if (item.dataset.sheet) {
                    currentView = 'sheet';
                    document.getElementById('pageTitle').innerText = item.dataset.sheet;
                    showSheetData(item.dataset.sheet);
                }
                
                if (window.innerWidth <= 768) toggleSidebar(false);
            });
        });
        
        document.querySelector('.menu-item[data-view="dashboard"]').classList.add('active');
    }

    // ========================================
    // DASHBOARD (Analytics Only)
    // ========================================
    function showDashboard() {
        document.getElementById('searchInput').value = '';
        document.getElementById('clearSearchBtn').classList.remove('show');
        
        const totalItems = Object.values(allSheetsData).reduce((sum, data) => sum + data.length, 0);
        
        document.getElementById('content').innerHTML = `
            <div class="analytics-container">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number">${sheetsList.length}</div>
                        <div class="stat-label">Database</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${totalItems}</div>
                        <div class="stat-label">Total Items</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">⚡</div>
                        <div class="stat-label">Real-time</div>
                    </div>
                </div>
                <div class="stat-card">
                    <h3 style="margin-bottom:16px;">📊 Statistik per Database</h3>
                    ${sheetsList.map(sheet => `
                        <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border-color);">
                            <span>📄 ${escapeHtml(sheet)}</span>
                            <span style="color:var(--accent);">${allSheetsData[sheet]?.length || 0} items</span>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }

    // ========================================
    // SHEET DATA (Chat Style)
    // ========================================
    function showSheetData(sheetName) {
        const data = allSheetsData[sheetName] || [];
        renderChatMessages(data, sheetName);
    }

    function renderChatMessages(data, sheetName) {
        const container = document.getElementById('content');
        
        if (!data.length) {
            container.innerHTML = `<div class="empty-state"><span style="font-size:48px;">📭</span><p>Tidak ada data</p></div>`;
            return;
        }
        
        let html = `<div class="chat-container">`;
        
        data.forEach((item, idx) => {
            const title = Object.values(item)[0] || "Tanpa judul";
            const answer = getAnswerFromItem(item);
            const preview = answer.substring(0, 100) + (answer.length > 100 ? '...' : '');
            
            html += `
                <div class="message-item" onclick="showDetail('${sheetName}', ${idx})">
                    <div class="message-avatar">💬</div>
                    <div class="message-content">
                        <div class="message-title">
                            <span>${escapeHtml(title.substring(0, 50))}</span>
                            <span class="message-sheet">${escapeHtml(sheetName)}</span>
                        </div>
                        <div class="message-preview">
                            <span>${escapeHtml(preview)}</span>
                            <button class="copy-message-btn" onclick="event.stopPropagation(); copyAnswer('${escapeHtml(answer).replace(/'/g, "\\'")}', this)">📋 Salin</button>
                        </div>
                    </div>
                </div>
            `;
        });
        
        html += `</div>`;
        container.innerHTML = html;
    }

    // ========================================
    // SEARCH (Chat Style Results)
    // ========================================
    let searchTimeout;
    
    function initSearch() {
        const input = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearSearchBtn');
        
        input.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            const keyword = input.value.trim();
            
            if (keyword.length > 0) {
                clearBtn.classList.add('show');
            } else {
                clearBtn.classList.remove('show');
            }
            
            if (keyword.length < 2) {
                if (currentView === 'dashboard') {
                    showDashboard();
                } else if (currentView !== 'dashboard' && currentView !== 'search') {
                    showSheetData(currentView);
                } else {
                    showDashboard();
                }
                return;
            }
            
            searchTimeout = setTimeout(async () => {
                await performSearch(keyword);
            }, 300);
        });
        
        clearBtn.addEventListener('click', () => {
            input.value = '';
            clearBtn.classList.remove('show');
            input.focus();
            if (currentView === 'dashboard') {
                showDashboard();
            } else if (currentView !== 'dashboard' && currentView !== 'search') {
                showSheetData(currentView);
            } else {
                showDashboard();
            }
        });
    }
    
    async function performSearch(keyword) {
        const container = document.getElementById('content');
        container.innerHTML = `<div class="loading"><div class="spinner"></div><p>Mencari "${escapeHtml(keyword)}"...</p></div>`;
        
        const results = await searchData(keyword);
        lastSearchResults = results;
        currentView = 'search';
        document.getElementById('pageTitle').innerText = `Hasil: ${keyword}`;
        
        if (!results.length) {
            container.innerHTML = `<div class="empty-state"><span style="font-size:48px;">🔍</span><p>Tidak ada hasil untuk "${escapeHtml(keyword)}"</p></div>`;
            return;
        }
        
        let html = `<div class="chat-container">`;
        
        results.forEach((item, idx) => {
            const sheet = item.sheet || "Unknown";
            const title = item.title || item.judul || item.nama || Object.values(item)[0] || "Tanpa judul";
            const answer = getAnswerFromItem(item);
            const preview = answer.substring(0, 100) + (answer.length > 100 ? '...' : '');
            
            html += `
                <div class="message-item" onclick="showSearchDetail(${idx})">
                    <div class="message-avatar">🔍</div>
                    <div class="message-content">
                        <div class="message-title">
                            <span>${escapeHtml(title.substring(0, 50))}</span>
                            <span class="message-sheet">${escapeHtml(sheet)}</span>
                        </div>
                        <div class="message-preview">
                            <span>${escapeHtml(preview)}</span>
                            <button class="copy-message-btn" onclick="event.stopPropagation(); copyAnswer('${escapeHtml(answer).replace(/'/g, "\\'")}', this)">📋 Salin</button>
                        </div>
                    </div>
                </div>
            `;
        });
        
        html += `</div>`;
        container.innerHTML = html;
    }

    // ========================================
    // DETAIL MODAL
    // ========================================
    function showDetail(sheetName, idx) {
        const data = allSheetsData[sheetName];
        const item = data[idx];
        if (!item) return;
        
        const answer = getAnswerFromItem(item);
        
        const modal = document.getElementById('detailModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const modalCopyBtn = document.getElementById('modalCopyBtn');
        
        modalTitle.innerHTML = `📋 ${escapeHtml(sheetName)}`;
        
        let bodyHtml = '';
        for (const [key, val] of Object.entries(item)) {
            bodyHtml += `
                <div class="detail-row">
                    <div class="detail-label">${escapeHtml(key)}</div>
                    <div class="detail-value">${escapeHtml(String(val))}</div>
                </div>
            `;
        }
        modalBody.innerHTML = bodyHtml;
        
        modalCopyBtn.onclick = () => copyAnswer(answer, modalCopyBtn);
        
        modal.classList.add('active');
    }
    
    function showSearchDetail(idx) {
        const item = lastSearchResults[idx];
        if (!item) return;
        
        const answer = getAnswerFromItem(item);
        
        const modal = document.getElementById('detailModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const modalCopyBtn = document.getElementById('modalCopyBtn');
        
        modalTitle.innerHTML = `📋 ${escapeHtml(item.sheet || 'Detail')}`;
        
        let bodyHtml = '';
        for (const [key, val] of Object.entries(item)) {
            if (key === 'sheet') continue;
            bodyHtml += `
                <div class="detail-row">
                    <div class="detail-label">${escapeHtml(key)}</div>
                    <div class="detail-value">${escapeHtml(String(val))}</div>
                </div>
            `;
        }
        modalBody.innerHTML = bodyHtml;
        
        modalCopyBtn.onclick = () => copyAnswer(answer, modalCopyBtn);
        
        modal.classList.add('active');
    }
    
    function closeModal() {
        document.getElementById('detailModal').classList.remove('active');
    }

    // ========================================
    // UTILITIES
    // ========================================
    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }
    
    function toggleSidebar(show) {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        if (show) {
            sidebar.classList.add('open');
            overlay.classList.add('active');
        } else {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        }
    }
    
    async function refreshData() {
        if (isLoading) {
            showToast('⏳ Masih memuat...');
            return;
        }
        await loadAllData(true);
    }

    // ========================================
    // GLOBAL FUNCTIONS
    // ========================================
    window.showDetail = showDetail;
    window.showSearchDetail = showSearchDetail;
    window.closeModal = closeModal;
    window.copyAnswer = copyAnswer;
    window.refreshData = refreshData;
    
    // ========================================
    // INIT
    // ========================================
    document.addEventListener('DOMContentLoaded', async () => {
        const mobileBtn = document.getElementById('mobileMenuBtn');
        const overlay = document.getElementById('sidebarOverlay');
        const refreshBtn = document.getElementById('refreshBtn');
        const themeToggleBtn = document.getElementById('themeToggle');
        
        mobileBtn.onclick = () => toggleSidebar(true);
        overlay.onclick = () => toggleSidebar(false);
        refreshBtn.onclick = () => refreshData();
        themeToggleBtn.onclick = () => toggleTheme();
        
        initTheme();
        await loadAllData(false);
        initSearch();
    });
</script>
</body>
</html>
