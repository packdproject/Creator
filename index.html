<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Creator Vault - Fast</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            line-height: 1.5;
        }
        .app {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 260px;
            background: #0d0d0d;
            border-right: 1px solid #1f1f1f;
            padding: 16px;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #1f1f1f;
        }
        .menu {
            list-style: none;
        }
        .menu-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 2px;
            transition: all 0.15s;
            font-size: 13px;
        }
        .menu-item:hover {
            background: #1a1a1a;
        }
        .menu-item.active {
            background: #1a3a5c;
            color: #4a9eff;
        }
        .menu-separator {
            font-size: 10px;
            color: #333;
            padding: 6px 12px;
        }
        .main {
            flex: 1;
            padding: 20px 24px;
            overflow-x: auto;
        }
        .header h1 {
            font-size: 28px;
            margin-bottom: 4px;
        }
        .header p {
            color: #888;
            font-size: 13px;
        }
        .search-box {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #1f1f1f;
            border-radius: 12px;
            background: #121212;
            color: #fff;
            font-size: 14px;
            margin: 16px 0 20px;
        }
        .search-box:focus {
            outline: none;
            border-color: #4a9eff;
        }
        .card {
            background: #0d0d0d;
            border: 1px solid #1a1a1a;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #121212;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }
        .stat-number {
            font-size: 36px;
            font-weight: 800;
            color: #4a9eff;
        }
        .stat-label {
            font-size: 12px;
            color: #888;
            margin-top: 6px;
        }
        .sheet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }
        .sheet-card {
            background: #121212;
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid #1f1f1f;
        }
        .sheet-card:hover {
            border-color: #4a9eff;
            transform: translateY(-2px);
        }
        .sheet-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }
        .sheet-name {
            font-weight: 600;
            font-size: 14px;
        }
        .sheet-count {
            font-size: 11px;
            color: #4a9eff;
            margin-top: 4px;
        }
        .table-responsive {
            overflow-x: auto;
        }
        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        .table th, .table td {
            padding: 10px 8px;
            border-bottom: 1px solid #1a1a1a;
            text-align: left;
        }
        .table th {
            background: #0f0f0f;
            color: #aaa;
            font-weight: 600;
        }
        .table tbody tr:hover {
            background: #121212;
            cursor: pointer;
        }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
        }
        .pagination button {
            background: #121212;
            border: 1px solid #2a2a2a;
            padding: 6px 16px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            font-size: 12px;
        }
        .pagination button:disabled {
            opacity: 0.4;
        }
        .detail-row {
            display: flex;
            padding: 10px 0;
            border-bottom: 1px solid #1a1a1a;
        }
        .detail-label {
            width: 150px;
            font-weight: 600;
            color: #4a9eff;
            font-size: 12px;
        }
        .detail-value {
            flex: 1;
            font-size: 12px;
            word-break: break-word;
        }
        .detail-value pre {
            background: #0a0a0a;
            padding: 8px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 11px;
        }
        .btn-primary, .btn-secondary, .btn-small {
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
        }
        .btn-primary {
            background: #4a9eff;
            color: white;
        }
        .btn-secondary {
            background: #1f1f1f;
            color: white;
        }
        .btn-small {
            background: #1a1a1a;
            padding: 3px 10px;
            font-size: 11px;
        }
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .filter-bar input {
            flex: 1;
            padding: 8px 14px;
            background: #121212;
            border: 1px solid #2a2a2a;
            border-radius: 20px;
            color: white;
            font-size: 12px;
        }
        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .loading-spinner {
            width: 32px;
            height: 32px;
            margin: 0 auto 16px;
            border: 2px solid #1f1f1f;
            border-top: 2px solid #4a9eff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .skeleton {
            background: linear-gradient(90deg, #121212 25%, #1a1a1a 50%, #121212 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .badge {
            background: #4a9eff;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 10px;
        }
        .search-item {
            padding: 10px 12px;
            border-bottom: 1px solid #1a1a1a;
            cursor: pointer;
        }
        .search-item:hover {
            background: #121212;
        }
        @media (max-width: 768px) {
            .app { flex-direction: column; }
            .sidebar { width: 100%; height: auto; }
            .menu { display: flex; flex-wrap: wrap; gap: 6px; }
            .menu-separator { display: none; }
            .main { padding: 16px; }
            .stats-grid { grid-template-columns: 1fr; }
            .detail-row { flex-direction: column; }
            .detail-label { width: 100%; margin-bottom: 4px; }
        }
    </style>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="logo">⚡ Creator Vault</div>
            <ul class="menu" id="sidebarMenu">
                <li class="skeleton" style="height: 32px; margin: 8px;"></li>
                <li class="skeleton" style="height: 32px; margin: 8px;"></li>
                <li class="skeleton" style="height: 32px; margin: 8px;"></li>
            </ul>
        </aside>

        <main class="main">
            <div class="header">
                <h1>Creator Vault</h1>
                <p>Fast & Light Personal Knowledge Hub</p>
            </div>
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 Cari... (min 2 karakter)">
            <div id="searchResults"></div>
            <div id="content">
                <div class="card">
                    <div class="loading-spinner"></div>
                    <p style="text-align:center">Loading...</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        // ==================== CONFIG ====================
        const API_URL = "https://script.google.com/macros/s/AKfycbxtkfn059eEdHCPKPeYMu5UL0HyAYtMz7MWb5kQoqmJM1PIDG1RA64AxArCAqQLs_IG/exec";
        const ITEMS_PER_PAGE = 15;
        const CACHE_TTL = 5 * 60 * 1000; // 5 menit cache

        // ==================== CACHE SYSTEM ====================
        const cache = new Map();

        function getCache(key) {
            const item = cache.get(key);
            if (item && Date.now() - item.timestamp < CACHE_TTL) {
                return item.data;
            }
            return null;
        }

        function setCache(key, data) {
            cache.set(key, { data, timestamp: Date.now() });
        }

        // ==================== API FUNCTIONS (with cache) ====================
        async function getSheets() {
            const cached = getCache('sheets');
            if (cached) return cached;
            
            try {
                const res = await fetch(`${API_URL}?action=sheets`);
                const data = await res.json();
                const sheets = Array.isArray(data) ? data : ["Ebook", "Produk", "TemplateChat", "Affiliate", "PromptAI", "IdeKonten", "Notes"];
                setCache('sheets', sheets);
                return sheets;
            } catch (error) {
                console.error("getSheets error:", error);
                return ["Ebook", "Produk", "TemplateChat", "Affiliate", "PromptAI"];
            }
        }

        async function getSheetData(sheetName, forceRefresh = false) {
            const cacheKey = `sheet_${sheetName}`;
            if (!forceRefresh) {
                const cached = getCache(cacheKey);
                if (cached) return cached;
            }
            
            try {
                const res = await fetch(`${API_URL}?action=data&sheet=${encodeURIComponent(sheetName)}`);
                const data = await res.json();
                
                let result = [];
                
                // Convert 2D array to objects
                if (Array.isArray(data) && data.length >= 2 && Array.isArray(data[0])) {
                    const headers = data[0];
                    const rows = data.slice(1);
                    result = rows.map(row => {
                        const obj = {};
                        headers.forEach((h, i) => obj[h] = row[i] || "");
                        return obj;
                    });
                } else if (Array.isArray(data) && data.length > 0 && typeof data[0] === 'object') {
                    result = data;
                }
                
                setCache(cacheKey, result);
                return result;
            } catch (error) {
                console.error(`getSheetData ${sheetName} error:`, error);
                return [];
            }
        }

        async function searchData(keyword) {
            if (!keyword || keyword.length < 2) return [];
            
            const cacheKey = `search_${keyword}`;
            const cached = getCache(cacheKey);
            if (cached) return cached;
            
            try {
                const res = await fetch(`${API_URL}?action=search&q=${encodeURIComponent(keyword)}`);
                const data = await res.json();
                const results = Array.isArray(data) ? data : [];
                setCache(cacheKey, results);
                return results;
            } catch (error) {
                console.error("search error:", error);
                return [];
            }
        }

        // ==================== GLOBAL STATE ====================
        let currentSheet = null;
        let currentPage = 1;
        let currentData = [];
        let currentHeaders = [];
        let currentFilter = "";
        let lastSearchData = null;
        let isLoading = false;

        // ==================== SIDEBAR ====================
        async function loadSidebar() {
            const menu = document.getElementById("sidebarMenu");
            const sheets = await getSheets();
            
            menu.innerHTML = `
                <li class="menu-item active" onclick="loadDashboard()">📊 Dashboard</li>
                <li class="menu-separator">──────────</li>
                ${sheets.map(s => `<li class="menu-item" onclick="loadSheet('${s}')">📄 ${s}</li>`).join('')}
                <li class="menu-separator" style="margin-top:16px">──────────</li>
                <li class="menu-item" onclick="refreshAllData()">🔄 Refresh All</li>
            `;
        }

        function setActiveMenu(activeText) {
            document.querySelectorAll(".menu-item").forEach(item => {
                item.classList.remove("active");
                if (item.textContent.includes(activeText)) item.classList.add("active");
            });
        }

        // ==================== DASHBOARD (Fast parallel loading) ====================
        async function loadDashboard() {
            if (isLoading) return;
            isLoading = true;
            
            const content = document.getElementById("content");
            content.innerHTML = '<div class="card"><div class="loading-spinner"></div><p style="text-align:center">Loading dashboard...</p></div>';
            document.getElementById("searchResults").innerHTML = "";
            document.getElementById("searchInput").value = "";
            
            try {
                const sheets = await getSheets();
                
                // Parallel loading all sheets data
                const promises = sheets.map(sheet => getSheetData(sheet));
                const allData = await Promise.all(promises);
                
                const stats = sheets.map((name, i) => ({ name, count: allData[i].length }));
                const totalItems = stats.reduce((s, i) => s + i.count, 0);
                
                let html = `
                    <div class="stats-grid">
                        <div class="stat-card"><div class="stat-number">${sheets.length}</div><div class="stat-label">Database</div></div>
                        <div class="stat-card"><div class="stat-number">${totalItems}</div><div class="stat-label">Total Items</div></div>
                        <div class="stat-card"><div class="stat-number">⚡</div><div class="stat-label">Cached</div></div>
                    </div>
                    <div class="card">
                        <h3>📚 Database</h3>
                        <div class="sheet-grid">
                            ${stats.map(s => `
                                <div class="sheet-card" onclick="loadSheet('${s.name}')">
                                    <div class="sheet-icon">📄</div>
                                    <div class="sheet-name">${escapeHtml(s.name)}</div>
                                    <div class="sheet-count">${s.count} items</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                
                content.innerHTML = html;
                setActiveMenu("Dashboard");
                
            } catch (error) {
                content.innerHTML = `<div class="card"><h3>Error</h3><p>${error.message}</p><button onclick="loadDashboard()" class="btn-primary">Retry</button></div>`;
            } finally {
                isLoading = false;
            }
        }

        // ==================== SHEET VIEWER ====================
        async function loadSheet(sheetName) {
            if (isLoading) return;
            isLoading = true;
            
            currentSheet = sheetName;
            currentPage = 1;
            currentFilter = "";
            
            const content = document.getElementById("content");
            content.innerHTML = '<div class="card"><div class="loading-spinner"></div><p style="text-align:center">Loading data...</p></div>';
            document.getElementById("searchResults").innerHTML = "";
            document.getElementById("searchInput").value = "";
            
            try {
                currentData = await getSheetData(sheetName);
                currentHeaders = currentData.length > 0 ? Object.keys(currentData[0]) : [];
                renderSheetData();
                setActiveMenu(sheetName);
            } catch (error) {
                content.innerHTML = `<div class="card"><h3>Error</h3><p>${error.message}</p><button onclick="loadSheet('${sheetName}')" class="btn-primary">Retry</button></div>`;
            } finally {
                isLoading = false;
            }
        }

        function renderSheetData() {
            const content = document.getElementById("content");
            
            if (!currentData.length) {
                content.innerHTML = `<div class="card"><h2>📄 ${escapeHtml(currentSheet)}</h2><p>No data</p><button onclick="loadDashboard()" class="btn-primary">← Back</button></div>`;
                return;
            }
            
            let filteredData = [...currentData];
            if (currentFilter) {
                filteredData = currentData.filter(row => 
                    JSON.stringify(row).toLowerCase().includes(currentFilter.toLowerCase())
                );
            }
            
            const totalPages = Math.ceil(filteredData.length / ITEMS_PER_PAGE);
            const startIdx = (currentPage - 1) * ITEMS_PER_PAGE;
            const pageData = filteredData.slice(startIdx, startIdx + ITEMS_PER_PAGE);
            
            let html = `
                <div class="sheet-header">
                    <div><h2>📄 ${escapeHtml(currentSheet)}</h2><span style="font-size:12px;color:#4a9eff">${filteredData.length} items</span></div>
                    <button onclick="loadDashboard()" class="btn-secondary">← Dashboard</button>
                </div>
                <div class="card">
                    <div class="filter-bar">
                        <input type="text" id="sheetFilter" placeholder="🔍 Filter..." value="${escapeHtml(currentFilter)}" onkeyup="filterSheetData(event)">
                        ${currentFilter ? `<button onclick="clearFilter()" class="btn-small">Clear</button>` : ""}
                    </div>
                    <div class="table-responsive">
                        <table class="table">
                            <thead><tr>${currentHeaders.map(h => `<th>${escapeHtml(h)}</th>`).join('')}<th></th></tr></thead>
                            <tbody>
                                ${pageData.map((row, idx) => `
                                    <tr onclick="showDetail(${startIdx + idx})">
                                        ${currentHeaders.map(h => `<td title="${escapeHtml(row[h] || '')}">${escapeHtml(String(row[h] || '').substring(0, 40))}</td>`).join('')}
                                        <td><button class="btn-small" onclick="event.stopPropagation(); showDetail(${startIdx + idx})">Detail</button></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                    ${totalPages > 1 ? `
                        <div class="pagination">
                            <button onclick="changePage(-1)" ${currentPage === 1 ? 'disabled' : ''}>◀ Prev</button>
                            <span>${currentPage} / ${totalPages}</span>
                            <button onclick="changePage(1)" ${currentPage === totalPages ? 'disabled' : ''}>Next ▶</button>
                        </div>
                    ` : ''}
                </div>
            `;
            
            content.innerHTML = html;
            const filterInput = document.getElementById("sheetFilter");
            if (filterInput) filterInput.focus();
        }

        function filterSheetData(event) {
            currentFilter = event.target.value;
            currentPage = 1;
            renderSheetData();
        }

        function clearFilter() {
            currentFilter = "";
            currentPage = 1;
            renderSheetData();
        }

        function changePage(delta) {
            currentPage += delta;
            renderSheetData();
        }

        function showDetail(index) {
            let filteredData = [...currentData];
            if (currentFilter) {
                filteredData = currentData.filter(row => 
                    JSON.stringify(row).toLowerCase().includes(currentFilter.toLowerCase())
                );
            }
            const item = filteredData[index];
            if (!item) return;
            
            let html = `
                <div class="card">
                    <div style="display:flex;justify-content:space-between;margin-bottom:16px">
                        <h3>📋 Detail - ${escapeHtml(currentSheet)}</h3>
                        <button onclick="loadSheet('${currentSheet}')" class="btn-secondary">✖ Close</button>
                    </div>
                    ${Object.entries(item).map(([k, v]) => `
                        <div class="detail-row">
                            <div class="detail-label">${escapeHtml(k)}</div>
                            <div class="detail-value">${isUrl(v) ? `<a href="${v}" target="_blank">${escapeHtml(v)}</a>` : escapeHtml(String(v)) || '-'}</div>
                        </div>
                    `).join('')}
                    <div style="margin-top:16px"><button onclick="loadSheet('${currentSheet}')" class="btn-primary">← Back to list</button></div>
                </div>
            `;
            document.getElementById("content").innerHTML = html;
        }

        // ==================== SEARCH (Debounced) ====================
        let searchTimeout;
        
        function initSearch() {
            const input = document.getElementById("searchInput");
            input.addEventListener("input", async () => {
                clearTimeout(searchTimeout);
                const keyword = input.value.trim();
                if (keyword.length < 2) {
                    document.getElementById("searchResults").innerHTML = "";
                    return;
                }
                searchTimeout = setTimeout(async () => {
                    const resultsDiv = document.getElementById("searchResults");
                    resultsDiv.innerHTML = '<div class="card"><p>🔍 Searching...</p></div>';
                    const data = await searchData(keyword);
                    if (!data.length) {
                        resultsDiv.innerHTML = `<div class="card"><p>No results for "${escapeHtml(keyword)}"</p></div>`;
                        return;
                    }
                    
                    // Group results
                    const grouped = {};
                    data.forEach(item => {
                        const sheet = item.sheet || "Unknown";
                        if (!grouped[sheet]) grouped[sheet] = [];
                        grouped[sheet].push(item);
                    });
                    
                    let html = `<div class="card"><h4>🔍 Results: "${escapeHtml(keyword)}"</h4><p>${data.length} found</p></div>`;
                    for (const [sheet, items] of Object.entries(grouped)) {
                        html += `<div class="card"><div style="font-weight:600;margin-bottom:8px" onclick="loadSheet('${sheet}')">📄 ${sheet} <span class="badge">${items.length}</span></div>`;
                        items.slice(0, 3).forEach((item, idx) => {
                            const title = item.title || item.judul || item.nama || "Item";
                            html += `<div class="search-item" onclick="loadSheet('${sheet}')">📌 ${escapeHtml(String(title).substring(0, 60))}</div>`;
                        });
                        if (items.length > 3) html += `<div style="font-size:11px;color:#4a9eff;margin-top:6px" onclick="loadSheet('${sheet}')">+ ${items.length-3} more...</div>`;
                        html += `</div>`;
                    }
                    resultsDiv.innerHTML = html;
                    lastSearchData = data;
                }, 300);
            });
        }

        // ==================== REFRESH ====================
        async function refreshAllData() {
            // Clear cache
            cache.clear();
            // Reload
            await loadSidebar();
            await loadDashboard();
            showToast("✅ Data refreshed!");
        }

        function showToast(msg) {
            const toast = document.createElement("div");
            toast.textContent = msg;
            toast.style.cssText = "position:fixed;bottom:20px;right:20px;background:#1a3a5c;color:white;padding:10px 20px;border-radius:30px;font-size:13px;z-index:9999";
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        // ==================== UTILITIES ====================
        function isUrl(str) {
            if (!str || typeof str !== 'string') return false;
            return str.startsWith('http://') || str.startsWith('https://');
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // ==================== EXPORT GLOBAL FUNCTIONS ====================
        window.loadDashboard = loadDashboard;
        window.loadSheet = loadSheet;
        window.showDetail = showDetail;
        window.changePage = changePage;
        window.filterSheetData = filterSheetData;
        window.clearFilter = clearFilter;
        window.refreshAllData = refreshAllData;

        // ==================== INIT ====================
        async function init() {
            await loadSidebar();
            await loadDashboard();
            initSearch();
        }
        
        init();
    </script>
</body>
</html>
