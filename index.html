<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Creator Vault - Personal Knowledge Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            line-height: 1.5;
        }

        .app {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: #0d0d0d;
            border-right: 1px solid #1f1f1f;
            padding: 20px;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #1f1f1f;
        }

        .menu {
            list-style: none;
        }

        .menu-item {
            padding: 12px 14px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 4px;
            transition: all 0.2s;
            font-size: 14px;
        }

        .menu-item:hover {
            background: #1a1a1a;
        }

        .menu-item.active {
            background: linear-gradient(135deg, #1a3a5c 0%, #0d2a4a 100%);
            color: #4a9eff;
            border-left: 3px solid #4a9eff;
        }

        .menu-separator {
            font-size: 11px;
            color: #333;
            padding: 8px 12px;
        }

        /* Main */
        .main {
            flex: 1;
            padding: 28px 32px;
            overflow-x: auto;
        }

        .header {
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 32px;
            background: linear-gradient(135deg, #fff, #4a9eff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header p {
            color: #888;
            font-size: 14px;
        }

        /* Search */
        .search-box {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid #1f1f1f;
            border-radius: 14px;
            background: #121212;
            color: #fff;
            font-size: 15px;
            margin-bottom: 24px;
        }

        .search-box:focus {
            outline: none;
            border-color: #4a9eff;
        }

        /* Cards */
        .card {
            background: #0d0d0d;
            border: 1px solid #1a1a1a;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: linear-gradient(135deg, #0f0f1a, #0a0a12);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            border: 1px solid #1f1f2a;
        }

        .stat-number {
            font-size: 48px;
            font-weight: 800;
            color: #4a9eff;
        }

        .stat-label {
            margin-top: 10px;
            color: #aaa;
            font-size: 13px;
        }

        /* Sheet Grid */
        .sheet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .sheet-card {
            background: #121212;
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.25s;
            border: 1px solid #1f1f1f;
        }

        .sheet-card:hover {
            transform: translateY(-3px);
            border-color: #4a9eff;
            background: #181818;
        }

        .sheet-icon {
            font-size: 36px;
            margin-bottom: 14px;
        }

        .sheet-name {
            font-weight: 700;
            font-size: 17px;
        }

        .sheet-count {
            font-size: 12px;
            color: #4a9eff;
            margin-top: 6px;
        }

        /* Table */
        .table-responsive {
            overflow-x: auto;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .table th,
        .table td {
            padding: 12px;
            border-bottom: 1px solid #1a1a1a;
            text-align: left;
        }

        .table th {
            background: #0f0f0f;
            color: #aaa;
            font-weight: 600;
        }

        .table tbody tr:hover {
            background: #121212;
            cursor: pointer;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #1a1a1a;
        }

        .pagination button {
            background: #121212;
            border: 1px solid #2a2a2a;
            padding: 8px 20px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
        }

        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Detail */
        .detail-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #1f1f1f;
        }

        .detail-row {
            display: flex;
            padding: 12px 0;
            border-bottom: 1px solid #1a1a1a;
        }

        .detail-label {
            width: 180px;
            font-weight: 600;
            color: #4a9eff;
        }

        .detail-value {
            flex: 1;
            word-break: break-word;
        }

        .detail-value pre {
            background: #0a0a0a;
            padding: 8px;
            border-radius: 8px;
            overflow-x: auto;
        }

        .btn-primary, .btn-secondary, .btn-small {
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-primary {
            background: #4a9eff;
        }

        .btn-primary:hover {
            background: #3a7ecc;
        }

        .btn-secondary {
            background: #1f1f1f;
        }

        .btn-small {
            background: #1a1a1a;
            padding: 4px 12px;
            font-size: 11px;
        }

        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #1a1a1a;
        }

        .filter-bar input {
            flex: 1;
            padding: 10px 16px;
            background: #121212;
            border: 1px solid #2a2a2a;
            border-radius: 40px;
            color: white;
        }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            margin: 0 auto 20px;
            border: 3px solid #1f1f1f;
            border-top: 3px solid #4a9eff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .badge {
            background: #4a9eff;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 11px;
        }

        .search-item {
            padding: 12px;
            border-bottom: 1px solid #1a1a1a;
            cursor: pointer;
        }

        .search-item:hover {
            background: #121212;
        }

        @media (max-width: 768px) {
            .app { flex-direction: column; }
            .sidebar { width: 100%; height: auto; }
            .menu { display: flex; flex-wrap: wrap; gap: 8px; }
            .menu-separator { display: none; }
            .main { padding: 16px; }
            .detail-row { flex-direction: column; }
            .detail-label { width: 100%; margin-bottom: 6px; }
        }
    </style>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="logo">🏦 Creator Vault</div>
            <ul class="menu" id="sidebarMenu">
                <li>Loading...</li>
            </ul>
        </aside>

        <main class="main">
            <div class="header">
                <h1>Creator Vault</h1>
                <p>Personal Knowledge Hub & Digital Library</p>
            </div>

            <input type="text" id="searchInput" class="search-box" placeholder="🔍 Cari ebook, produk, prompt, affiliate...">

            <div id="searchResults"></div>
            <div id="content">
                <div class="card">
                    <div class="loading-spinner"></div>
                    <h3>Memulai Creator Vault...</h3>
                </div>
            </div>
        </main>
    </div>

    <script>
        // ==================== CONFIG ====================
        const API_URL = "https://script.google.com/macros/s/AKfycbxtkfn059eEdHCPKPeYMu5UL0HyAYtMz7MWb5kQoqmJM1PIDG1RA64AxArCAqQLs_IG/exec";
        const ITEMS_PER_PAGE = 20;

        // ==================== GLOBAL ====================
        let currentSheet = null;
        let currentPage = 1;
        let currentData = [];
        let currentHeaders = [];
        let currentFilter = "";
        let lastSearchData = null;

        // ==================== API FUNCTIONS ====================
        async function getSheets() {
            try {
                const res = await fetch(`${API_URL}?action=sheets`);
                const data = await res.json();
                console.log("getSheets response:", data);
                
                if (Array.isArray(data)) return data;
                if (data && Array.isArray(data.sheets)) return data.sheets;
                if (data && Array.isArray(data.data)) return data.data;
                
                // Fallback manual
                return ["Ebook", "Produk", "TemplateChat", "Affiliate", "PromptAI", "IdeKonten", "Notes"];
            } catch (error) {
                console.error("getSheets error:", error);
                return ["Ebook", "Produk", "TemplateChat", "Affiliate", "PromptAI"];
            }
        }

        async function getSheetData(sheetName) {
            try {
                const res = await fetch(`${API_URL}?action=data&sheet=${encodeURIComponent(sheetName)}`);
                const data = await res.json();
                
                console.log(`📊 Data untuk "${sheetName}":`, data);
                
                // CASE 1: Array of objects langsung
                if (Array.isArray(data) && data.length > 0 && typeof data[0] === 'object' && !Array.isArray(data[0])) {
                    console.log(`✅ ${sheetName} adalah array of objects, ${data.length} items`);
                    return data;
                }
                
                // CASE 2: 2D array [[headers], [rows]]
                if (Array.isArray(data) && data.length >= 2 && Array.isArray(data[0])) {
                    const headers = data[0];
                    const rows = data.slice(1);
                    console.log(`✅ ${sheetName} dikonversi dari 2D array, headers:`, headers);
                    return rows.map(row => {
                        const obj = {};
                        headers.forEach((h, i) => {
                            obj[h] = row[i] !== undefined ? row[i] : "";
                        });
                        return obj;
                    });
                }
                
                // CASE 3: Dibalut object {success: true, data: ...}
                if (data && data.success === true && data.data) {
                    const inner = data.data;
                    if (Array.isArray(inner) && inner.length >= 2 && Array.isArray(inner[0])) {
                        const headers = inner[0];
                        const rows = inner.slice(1);
                        return rows.map(row => {
                            const obj = {};
                            headers.forEach((h, i) => obj[h] = row[i] || "");
                            return obj;
                        });
                    }
                    if (Array.isArray(inner)) return inner;
                }
                
                // CASE 4: Single object
                if (data && typeof data === 'object' && !Array.isArray(data) && Object.keys(data).length > 0) {
                    return [data];
                }
                
                console.warn(`⚠️ Format tidak dikenal untuk ${sheetName}:`, typeof data);
                return [];
                
            } catch (error) {
                console.error(`❌ getSheetData ${sheetName} error:`, error);
                return [];
            }
        }

        async function searchData(keyword) {
            if (!keyword || keyword.length < 2) return [];
            try {
                const res = await fetch(`${API_URL}?action=search&q=${encodeURIComponent(keyword)}`);
                const data = await res.json();
                if (Array.isArray(data)) return data;
                return [];
            } catch (error) {
                console.error("search error:", error);
                return [];
            }
        }

        // ==================== SIDEBAR ====================
        async function loadSidebar() {
            const menu = document.getElementById("sidebarMenu");
            menu.innerHTML = '<li>🔄 Memuat menu...</li>';
            
            try {
                const sheets = await getSheets();
                menu.innerHTML = "";
                
                const dashLi = document.createElement("li");
                dashLi.textContent = "📊 Dashboard";
                dashLi.className = "menu-item active";
                dashLi.onclick = () => { setActiveMenu(dashLi); loadDashboard(); };
                menu.appendChild(dashLi);
                
                const sep = document.createElement("li");
                sep.textContent = "──────────";
                sep.className = "menu-separator";
                menu.appendChild(sep);
                
                sheets.forEach(sheet => {
                    const li = document.createElement("li");
                    li.textContent = `📄 ${sheet}`;
                    li.className = "menu-item";
                    li.onclick = () => { setActiveMenu(li); loadSheet(sheet); };
                    menu.appendChild(li);
                });
                
            } catch (error) {
                menu.innerHTML = `<li>❌ Error: ${error.message}</li>`;
            }
        }

        function setActiveMenu(active) {
            document.querySelectorAll(".menu-item").forEach(item => item.classList.remove("active"));
            active.classList.add("active");
        }

        // ==================== DASHBOARD ====================
        async function loadDashboard() {
            const content = document.getElementById("content");
            content.innerHTML = '<div class="card"><div class="loading-spinner"></div><h3>Memuat Dashboard...</h3></div>';
            
            document.getElementById("searchResults").innerHTML = "";
            document.getElementById("searchInput").value = "";
            
            try {
                const sheets = await getSheets();
                const stats = [];
                let totalItems = 0;
                
                for (const sheet of sheets) {
                    const data = await getSheetData(sheet);
                    stats.push({ name: sheet, count: data.length });
                    totalItems += data.length;
                }
                
                let html = `
                    <div class="dashboard-welcome">
                        <h1>🏠 Creator Vault</h1>
                        <p>Personal Knowledge Hub</p>
                        <div class="last-updated">🕐 ${new Date().toLocaleTimeString()}</div>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-card"><div class="stat-number">${sheets.length}</div><div class="stat-label">Database</div></div>
                        <div class="stat-card"><div class="stat-number">${totalItems}</div><div class="stat-label">Total Items</div></div>
                        <div class="stat-card"><div class="stat-number">⚡</div><div class="stat-label">Live Sync</div></div>
                    </div>
                    <div class="card">
                        <h3>📚 Semua Database</h3>
                        <div class="sheet-grid">
                `;
                
                stats.forEach(s => {
                    html += `
                        <div class="sheet-card" onclick="loadSheet('${s.name}')">
                            <div class="sheet-icon">📄</div>
                            <div class="sheet-name">${escapeHtml(s.name)}</div>
                            <div class="sheet-count">${s.count} items</div>
                        </div>
                    `;
                });
                
                html += `</div></div>`;
                content.innerHTML = html;
                
            } catch (error) {
                content.innerHTML = `<div class="card error-card"><h3>Error</h3><p>${error.message}</p><button onclick="loadDashboard()">Coba Lagi</button></div>`;
            }
        }

        // ==================== SHEET VIEWER ====================
        async function loadSheet(sheetName) {
            currentSheet = sheetName;
            currentPage = 1;
            currentFilter = "";
            
            const content = document.getElementById("content");
            content.innerHTML = '<div class="card"><div class="loading-spinner"></div><h3>📄 Memuat data...</h3></div>';
            
            document.getElementById("searchResults").innerHTML = "";
            document.getElementById("searchInput").value = "";
            
            try {
                const data = await getSheetData(sheetName);
                currentData = data;
                
                if (data.length > 0) {
                    currentHeaders = Object.keys(data[0]);
                    console.log(`Headers untuk ${sheetName}:`, currentHeaders);
                } else {
                    currentHeaders = [];
                }
                
                renderSheetData();
            } catch (error) {
                content.innerHTML = `<div class="card error-card"><h3>Error</h3><p>${error.message}</p><button onclick="loadDashboard()">Kembali</button></div>`;
            }
        }

        function renderSheetData() {
            const content = document.getElementById("content");
            
            if (!currentData || currentData.length === 0) {
                content.innerHTML = `
                    <div class="card">
                        <h2>📄 ${escapeHtml(currentSheet)}</h2>
                        <p>Tidak ada data di sheet ini.</p>
                        <button onclick="loadDashboard()" class="btn-primary">← Kembali</button>
                    </div>
                `;
                return;
            }
            
            // Filter
            let filteredData = [...currentData];
            if (currentFilter) {
                filteredData = currentData.filter(row => 
                    JSON.stringify(row).toLowerCase().includes(currentFilter.toLowerCase())
                );
            }
            
            const totalPages = Math.ceil(filteredData.length / ITEMS_PER_PAGE);
            const startIdx = (currentPage - 1) * ITEMS_PER_PAGE;
            const pageData = filteredData.slice(startIdx, startIdx + ITEMS_PER_PAGE);
            
            let html = `
                <div class="sheet-header">
                    <div>
                        <h2>📄 ${escapeHtml(currentSheet)}</h2>
                        <div class="sheet-stats">📊 ${filteredData.length} item ditemukan</div>
                    </div>
                    <div>
                        <button onclick="loadDashboard()" class="btn-secondary">← Dashboard</button>
                    </div>
                </div>
                
                <div class="card">
                    <div class="filter-bar">
                        <input type="text" id="sheetFilter" placeholder="🔍 Filter data..." 
                               value="${escapeHtml(currentFilter)}" onkeyup="filterSheetData(event)">
                        ${currentFilter ? `<button onclick="clearFilter()" class="btn-small">✖ Clear</button>` : ""}
                    </div>
                    
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    ${currentHeaders.map(h => `<th>${escapeHtml(h)}</th>`).join('')}
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody>
            `;
            
            pageData.forEach((row, idx) => {
                const actualIdx = startIdx + idx;
                html += `<tr onclick="showDetail(${actualIdx})" style="cursor:pointer;">`;
                currentHeaders.forEach(h => {
                    let val = row[h] || "";
                    val = val.length > 40 ? val.substring(0, 40) + "..." : val;
                    html += `<td title="${escapeHtml(row[h] || "")}">${escapeHtml(val)}</td>`;
                });
                html += `<td><button class="btn-small" onclick="event.stopPropagation(); showDetail(${actualIdx})">Detail</button></td>`;
                html += `</tr>`;
            });
            
            html += `
                            </tbody>
                        </table>
                    </div>
            `;
            
            if (totalPages > 1) {
                html += `
                    <div class="pagination">
                        <button onclick="changePage(-1)" ${currentPage === 1 ? 'disabled' : ''}>◀ Prev</button>
                        <span>Page ${currentPage} of ${totalPages}</span>
                        <button onclick="changePage(1)" ${currentPage === totalPages ? 'disabled' : ''}>Next ▶</button>
                    </div>
                `;
            }
            
            html += `</div>`;
            content.innerHTML = html;
            
            const filterInput = document.getElementById("sheetFilter");
            if (filterInput) filterInput.focus();
        }

        function filterSheetData(event) {
            currentFilter = event.target.value;
            currentPage = 1;
            renderSheetData();
        }

        function clearFilter() {
            currentFilter = "";
            currentPage = 1;
            renderSheetData();
        }

        function changePage(delta) {
            currentPage += delta;
            renderSheetData();
        }

        function showDetail(index) {
            let filteredData = [...currentData];
            if (currentFilter) {
                filteredData = currentData.filter(row => 
                    JSON.stringify(row).toLowerCase().includes(currentFilter.toLowerCase())
                );
            }
            const item = filteredData[index];
            if (!item) return;
            
            let html = `
                <div class="card detail-card">
                    <div class="detail-header">
                        <h2>📋 Detail - ${escapeHtml(currentSheet)}</h2>
                        <button class="btn-close" onclick="loadSheet('${currentSheet}')">✖ Kembali</button>
                    </div>
                    <div class="detail-body">
            `;
            
            for (const [key, val] of Object.entries(item)) {
                html += `
                    <div class="detail-row">
                        <div class="detail-label">${escapeHtml(key)}</div>
                        <div class="detail-value">
                            ${isUrl(val) ? `<a href="${val}" target="_blank">${escapeHtml(val)}</a>` : 
                              val ? `<pre>${escapeHtml(String(val))}</pre>` : '-'}
                        </div>
                    </div>
                `;
            }
            
            html += `
                    </div>
                    <div class="detail-footer">
                        <button onclick="loadSheet('${currentSheet}')" class="btn-primary">← Kembali ke daftar</button>
                    </div>
                </div>
            `;
            
            document.getElementById("content").innerHTML = html;
        }

        // ==================== SEARCH ====================
        let searchTimeout;
        
        function initSearch() {
            const input = document.getElementById("searchInput");
            input.addEventListener("input", async () => {
                clearTimeout(searchTimeout);
                const keyword = input.value.trim();
                if (keyword.length < 2) {
                    document.getElementById("searchResults").innerHTML = "";
                    return;
                }
                searchTimeout = setTimeout(async () => {
                    const resultsDiv = document.getElementById("searchResults");
                    resultsDiv.innerHTML = '<div class="card">🔍 Mencari...</div>';
                    try {
                        const data = await searchData(keyword);
                        if (!data.length) {
                            resultsDiv.innerHTML = `<div class="card">Tidak ada hasil untuk "${escapeHtml(keyword)}"</div>`;
                            return;
                        }
                        
                        const grouped = {};
                        data.forEach(item => {
                            const sheet = item.sheet || "Unknown";
                            if (!grouped[sheet]) grouped[sheet] = [];
                            grouped[sheet].push(item);
                        });
                        
                        let html = `<div class="card"><h3>🔍 Hasil: "${escapeHtml(keyword)}"</h3><p>${data.length} ditemukan</p></div>`;
                        for (const [sheet, items] of Object.entries(grouped)) {
                            html += `<div class="card"><div class="search-sheet-header" onclick="loadSheet('${sheet}')">📄 ${sheet} <span class="badge">${items.length}</span></div>`;
                            items.slice(0, 5).forEach((item, idx) => {
                                const title = item.title || item.judul || item.nama || "Tanpa judul";
                                html += `<div class="search-item" onclick="showSearchDetail('${sheet}', ${idx})">📌 ${escapeHtml(String(title).substring(0, 80))}</div>`;
                            });
                            if (items.length > 5) {
                                html += `<div class="search-more" onclick="loadSheet('${sheet}')">+ ${items.length-5} hasil lainnya</div>`;
                            }
                            html += `</div>`;
                        }
                        resultsDiv.innerHTML = html;
                        lastSearchData = data;
                    } catch(e) {
                        resultsDiv.innerHTML = `<div class="card">Error: ${e.message}</div>`;
                    }
                }, 400);
            });
        }
        
        function showSearchDetail(sheet, idx) {
            if (!lastSearchData) return;
            const sheetItems = lastSearchData.filter(item => item.sheet === sheet);
            const item = sheetItems[idx];
            if (!item) return;
            
            let html = `
                <div class="card detail-card">
                    <div class="detail-header">
                        <h2>📋 Detail dari ${escapeHtml(sheet)}</h2>
                        <button class="btn-close" onclick="loadDashboard()">✖ Tutup</button>
                    </div>
                    <div class="detail-body">
            `;
            for (const [key, val] of Object.entries(item)) {
                if (key === 'sheet') continue;
                html += `<div class="detail-row"><div class="detail-label">${escapeHtml(key)}</div><div class="detail-value">${isUrl(val) ? `<a href="${val}" target="_blank">${escapeHtml(val)}</a>` : val ? `<pre>${escapeHtml(String(val))}</pre>` : '-'}</div></div>`;
            }
            html += `</div><div class="detail-footer"><button onclick="loadSheet('${sheet}')" class="btn-primary">📄 Lihat semua di ${sheet}</button></div></div>`;
            document.getElementById("content").innerHTML = html;
            document.getElementById("searchResults").innerHTML = "";
            document.getElementById("searchInput").value = "";
        }

        // ==================== UTILITIES ====================
        function isUrl(str) {
            if (!str || typeof str !== 'string') return false;
            return str.startsWith('http://') || str.startsWith('https://');
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // ==================== INIT ====================
        window.loadDashboard = loadDashboard;
        window.loadSheet = loadSheet;
        window.showDetail = showDetail;
        window.changePage = changePage;
        window.filterSheetData = filterSheetData;
        window.clearFilter = clearFilter;
        
        async function init() {
            await loadSidebar();
            await loadDashboard();
            initSearch();
        }
        
        init();
    </script>
</body>
</html>
